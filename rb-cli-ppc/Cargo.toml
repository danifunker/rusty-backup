# rb-cli-ppc — the mrustc / PowerPC manifest. A THIRD self-contained top-level
# package (sibling of rb-cli-vintage) that reuses the shared engine under ../src
# but carries the dependency deviations mrustc's C backend forces. Keeping them
# here means rb-cli-vintage/Cargo.toml stays pristine for the real
# x86_64-10.7 / Win7 vintage builds, and rusty-backup's main Cargo.toml is never
# touched.
#
# This package is built with mrustc, NOT cargo — see scripts/build-ppc.sh and
# docs/build-ppc-mrustc.md. It resolves with its own lockfile
# (rb-cli-ppc/Cargo.lock) and its own vendored sources (rb-cli-ppc/vendor,
# gitignored). Everything not listed under DEVIATIONS mirrors rb-cli-vintage
# exactly; when the two drift for any reason other than an mrustc limitation,
# that is a bug.
#
# DEVIATIONS FROM rb-cli-vintage (each entry is a crate mrustc cannot lower):
#   - zip: feature `deflate` -> `deflate-flate2` + `flate2`.
#       `deflate` = [flate2/rust_backend, deflate-zopfli, deflate-flate2];
#       deflate-zopfli pulls the `zopfli` crate, which pulls `bumpalo`, and
#       mrustc asserts out transpiling bumpalo (`Bump::shrink`,
#       hir_typeck/expr_cs.cpp:1665, "Failure to infer"). Only zopfli's
#       slower/smaller encoder is dropped — no archive-format change.
#       NOTE the `flate2` in that list, and don't remove it: `deflate-flate2`
#       is only `["_deflate-any"]` and does NOT enable the optional `flate2`
#       dependency — in zip's manifest that is `deflate`'s job, via
#       `flate2/rust_backend`. Without it zip compiles `use flate2::..` behind
#       `#[cfg(feature = "deflate-flate2")]` with no such crate in scope:
#         zip/src/write.rs:33:5-50 error:0: Cannot find component 1 of
#           crate::write::flate2::write::DeflateEncoder
#       `flate2` here is the implicit feature cargo creates for an optional
#       dependency; `rust_backend` comes from our own direct flate2 entry by
#       feature unification. This would fail identically under real cargo.
#   - env_logger: pin 0.11 -> 0.10. 0.11 switched its timestamp backend to
#       `jiff`, whose const-generic code mrustc can't lower ("Type mismatch in
#       path params" in jiff-core). 0.10 uses humantime instead. Same logging.
#   - libc: NOT pinnable back. 0.2.189's `src/new/linux::can` breaks mrustc, but
#       nix 0.31 (a linux-only dep) forbids any pre-`new` libc. This is a
#       host-proxy artifact only: the os/ platform layer (which pulls libc+nix)
#       is hand-C in the PPC shell, so the *engine* transpile shouldn't include
#       it at all. See the platform-split decision in docs/build-ppc-mrustc.md.
#   - rustyline: default-features = false, keeping only with-file-history and
#       with-dirs. The dropped default is `custom-bindings`, which exists solely
#       to pull `radix_trie`, and radix_trie aborts mrustc:
#         trie_common.rs:43:36 BUG: ASSERT FAIL: hir_typeck/common.cpp:761
#           Lifetime param /*I:0*/ out of range for (max 0)
#       `trait TrieCommon<'a, K, V>` declares a lifetime on the *trait*, and when
#       mrustc monomorphises a default method body that uses it (`fn iter(self)
#       -> Iter<'a, K, V>`) the impl PathParams it looks the lifetime up in has
#       no lifetimes recorded at all. The engine never touches the gated API -
#       it uses exactly `DefaultEditor`, `ReadlineError`, and the history calls,
#       none of which are behind custom-bindings - so nothing is lost here. (The
#       mrustc gap itself is generic and worth fixing; see docs/build-ppc-mrustc.md.)
#   - serde_json: held below 1.0.147. That release swapped the float formatter
#       from `ryu` to `zmij`, and zmij aborts mrustc outright:
#         BUG: src/hir/hir_ops.cpp:133: Mismatched types - f64 and f32
#       1.0.146 is the last `ryu` release. Identical JSON either way; only the
#       shortest-round-trip float printer differs.
#   - hashbrown: default-features = false. The entry is a version pin for
#       indexmap and nothing more, but as a *direct* dependency it also enabled
#       0.14's default `ahash` feature - and ahash pulls `zerocopy`, whose
#       const-generic `HasField` impls mrustc resolves to the wrong one:
#         error:0: Method project doesn't match trait:
#           Expected *mut B/*I:1*/  Found *mut A/*I:0*/
#       indexmap declares `default-features = false, features = ["raw"]` for
#       itself, so no crate in the graph actually wanted those defaults.
#   - serde_yml: optional, and this build leaves it OFF. Its backend `libyml`
#       hits an mrustc macro-expansion gap ("Unused tokens at the end of macro
#       expansion - TOK_RWORD_AS", scanner.rs:1937). The engine gates YAML
#       output behind a `yaml` feature that is on by default everywhere else, so
#       `--format yaml` simply disappears here; JSON carries the same schema.
# Also crc's `Digest::new` is turbofished by scripts/build-ppc.sh's
# patch_crc_vendor (const-generic mrustc can't infer).
#
# The empty [workspace] table makes this its own workspace root, so it resolves
# independently and is not pulled into the parent package's build.
[workspace]

[package]
name = "rb-cli-ppc"
version = "0.1.0"
edition = "2021"
# See rb-cli-vintage: drives the MSRV-aware resolver toward <=1.73 crate
# versions. mrustc bootstraps rustc 1.74, one minor above, so the same pins hold.
rust-version = "1.73"
license = "AGPL-3.0"
build = "../build.rs"

# Reuse the shared engine as a library, exactly like rb-cli-vintage.
[lib]
name = "rusty_backup"
path = "../src/lib.rs"

[[bin]]
name = "rb-cli"
path = "../src/bin/rb_cli.rs"

[features]
default = []
native-zstd = ["dep:zstd"]
remote = []
tui = ["dep:ratatui", "ratatui-legacy"]
ratatui-legacy = []
rust173-polyfill = []
windows-legacy = []
# Declared so the shared source's `#[cfg(feature = "yaml")]` resolves, but
# deliberately NOT in this build's feature list — see the serde_yml note below.
yaml = ["dep:serde_yml"]
# Replace the native macOS device layer (IOKit / DiskArbitration via objc2) with a
# signature-compatible stub. OFF everywhere except the PowerPC mrustc build:
# powerpc-apple-darwin reports target_os = "macos", so the real module would be
# compiled for it, and objc2 binds modern macOS frameworks that cannot be
# transpiled for a 2005 Mac. With this on, objc2-* leaves the dependency graph and
# raw-device access is unavailable while disk *images* work normally. See
# docs/native_osx_10_dot_3.md.
os-stub = []

[dependencies]
# --- TUI (pinned to the last 1.73-buildable line) ---
ratatui = { version = "0.29", default-features = false, features = ["crossterm"], optional = true }

# --- zstd backend (C, from source) ---
zstd = { version = "0.13", optional = true }

# --- always-on engine deps (mirror of rb-cli-vintage) ---
anyhow = "1"
thiserror = "2"
clap = { version = ">=4.4, <4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# DEVIATION (see header): held below 1.0.147, the version that swapped its
# float formatter from `ryu` to `zmij`. zmij aborts mrustc with
# "BUG: hir/hir_ops.cpp:133: Mismatched types - f64 and f32". Same JSON.
serde_json = ">=1, <1.0.147"
byteorder = "1"
encoding_rs = "0.8"
log = "0.4"
env_logger = "=0.10.2"  # DEVIATION: 0.11 pulls jiff (const-generic mrustc gap)
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
crc32c = "0.6"
crc32fast = "1"
chrono = "0.4"
tempfile = ">=3, <3.13"
dirs = "6"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lz4_flex = ">=0.10, <0.11"
tar = "0.4"
bzip2 = "=0.5.2"
# DEVIATION (see header): deflate-flate2, NOT `deflate` — `deflate` pulls
# zopfli -> bumpalo, which mrustc cannot transpile.
zip = { version = "=2.4.2", default-features = false, features = ["deflate-flate2", "flate2", "aes-crypto"] }
base64 = "0.22"
# DEVIATION (see header): optional and left OFF for this target. serde_yml's
# backend `libyml` hits an mrustc macro-expansion gap (`TOK_RWORD_AS`) in
# scanner.rs, so `--format yaml` is dropped here; JSON carries the same schema.
serde_yml = { version = "=0.0.12", optional = true }
csv = "1"
clap_complete = ">=4.4, <4.5"
globset = ">=0.4, <0.4.17"
# DEVIATION (see header): default-features = false to drop `custom-bindings`,
# which is the only thing pulling `radix_trie` (mrustc lifetime gap).
rustyline = { version = ">=12, <15", default-features = false, features = ["with-file-history", "with-dirs"] }
crossterm = "0.28"
shell-words = "1.1.1"
lzma-rs = "0.3.0"
lzfse_rust = "0.2.1"

# --- Transitive pins (mirror of rb-cli-vintage) ---
indexmap = "=2.5.0"
# DEVIATION (see header): default-features = false. This entry exists only to
# pin the version for indexmap, but declaring it as a direct dependency also
# turned on 0.14's default `ahash` feature, and ahash pulls `zerocopy`, whose
# const-generic `HasField` impls mrustc mis-selects ("Method project doesn't
# match trait"). indexmap asks for `default-features = false, features =
# ["raw"]` itself, so nothing else wanted the defaults.
hashbrown = { version = "=0.14.5", default-features = false }
zeroize = "=1.8.1"
home = "=0.5.9"
zeroize_derive = "=1.4.2"
jobserver = "=0.1.31"
crc = "=3.3.0"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# DEVIATION (see header): pinned below 0.2.186. From that version libc grows a
# `src/new/` tree whose `linux` module arrives via a glob re-export
# (`mod linux_uapi; pub(crate) use linux_uapi::*`), and mrustc cannot resolve
# `crate::new::linux::can::j1939` through it. That bites when minicargo builds
# libc for the *host* - required by `cc`/`jobserver`, the build-dependencies of
# bzip2-sys and zstd-sys - where target_os = "linux" selects exactly that module.
# 0.2.155 predates src/new/ entirely. libc itself cannot be dropped: it is used
# outside os/ by remote/service.rs, cli/verbs/tui_app.rs and (macOS-gated)
# fs/resource_fork.rs.
libc = "=0.2.155"

# DEVIATION (see header): no `nix`. It is a linux-only dependency (used only by
# src/os/linux.rs, never compiled for powerpc-apple-darwin), but Cargo lockfiles
# are target-agnostic, so nix 0.31's `libc >= 0.2.186` requirement would drag the
# whole graph onto a libc mrustc cannot lower. Dropping it is what lets the pin
# below work.

# DEVIATION (see header): the objc2-* stack that rb-cli-vintage declares here is
# absent. It is reachable only through src/os/macos.rs, which the `os-stub`
# feature replaces for this target, so declaring it would pull IOKit /
# DiskArbitration bindings into the graph that can neither transpile nor exist on
# a 2005 Mac.

[target.'cfg(target_os = "windows")'.dependencies]
self-replace = "1"
winreg = "0.56"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Power",
] }

[build-dependencies]
winres = "0.1"
