"backup.done" = "Backup complete."
"restore.backup_folder" = "Backup:"
"restore.target_kind" = "Target:"
"restore.target_image" = "Image file:"
"restore.start" = "[ Start restore ]"
"restore.confirm" = { key = "y" }
"restore.done" = "Restore complete."
