# What each controller id is called in each shell (FLOWS.md "Controls").
#
# A flow names a control by its controller id (`src/controller/*` `ids`); the driver
# looks it up here, then in the controllers' own labels (`rb-cli ui-labels`), then uses
# the name as a literal label. A value is the label, or a table:
#   label = "..."   the visible label
#   key   = "o"     activate it by this key (the TUI has keys where GTK has buttons)
#   pick  = "..."   the button whose file dialog fills this field (GTK path rows)
#   via   = "..."   open this first (the dropdown a menu entry lives in)
#   nth   = 1       the Nth same-named control (on the `via` dropdown when there is one)
#   skip  = true    this shell has no such step: behaviour drift, listed like label drift
# `wait` / `expect` names resolve here too; `<task>.done` is a controller's outcome message.
#
# Every label entry is drift from the controllers' words (D8). The TUI keeps only its keys;
# `[gtk]` empties once GTK reads the controller labels (a Linux session). Win32 finds
# controls by AutomationId; its section holds only behaviour drift and outcome words.

