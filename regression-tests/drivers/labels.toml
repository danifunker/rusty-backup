# What each controller id is called in each shell (FLOWS.md "Controls").
#
# A flow names a control by its controller id (`src/controller/*/mod.rs` `ids`); the driver
# looks it up here. A value is the label, or a table:
#   label = "..."   the visible label
#   key   = "o"     activate it by this key (the TUI has keys where GTK has buttons)
#   pick  = "..."   the button whose file dialog fills this field (GTK path rows)
#   via   = "..."   open this first (the dropdown a menu entry lives in)
# `wait` / `expect` names resolve here too, for messages each shell words its own way.
#
# Two shells naming one control differently is label drift; once labels come from the
# controllers this table shrinks to nothing. AppKit and Win32 will use the id directly.

[tui]
"backup.open_image" = { key = "o" }
"backup.destination" = "Output:"
"backup.name" = "Name:"
"backup.format" = "Format:"
"backup.start" = "[ Start backup ]"
"backup.done" = "Backup complete."
"restore.backup_folder" = "Backup:"
"restore.target_kind" = "Target:"
"restore.target_image" = "Image file:"
"restore.start" = "[ Start restore ]"
"restore.confirm" = { key = "y" }
"restore.done" = "Restore complete."
"commander.open" = { key = "9" }
"commander.right.open_image" = { key = "Tab Ctrl+O" }
"commander.left.open_folder" = { key = "Tab Ctrl+D" }
"commander.copy_to_right" = { key = "F6" }
"commander.right.apply" = { key = "Tab F10" }

[gtk]
"backup.open_image" = { label = "Open File...", via = "Select a device or image..." }
"backup.destination" = { label = "Folder", pick = "Browse..." }
"backup.name" = "Backup Name"
"backup.format" = "Output Format"
"backup.start" = "Start Backup"
"backup.done" = "Backup finished."
"restore.backup_folder" = { label = "Open Backup Folder...", via = "No folder selected" }
"restore.target_kind" = "Target"
"restore.target_image" = { label = "Image File", pick = "Save As..." }
"restore.start" = "Restore"
"restore.confirm" = "I understand, proceed"
"restore.done" = "Restore finished."
"commander.open" = "Commander Mode"
"commander.right.open_image" = { label = "Open File...", via = "Open image, backup, or folder...", nth = 1 }
"commander.left.open_folder" = { label = "Open Local Folder...", via = "Open image, backup, or folder..." }
"commander.copy_to_right" = "Copy"
"commander.right.apply" = "Apply (1)"
