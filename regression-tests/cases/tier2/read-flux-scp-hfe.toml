# Tier 2 — single-file flux images: SCP (Greaseweazle's native format) and HFE v1 / v3.
#
# All three are the Unisys ICON 4.10.01 help diskette, converted from its
# KryoFlux capture by Greaseweazle's own `gw convert` (an independent writer).
# Each must decode to the same volume as the sector dump: the tar export of all
# three is byte-identical to the one from `fs.qnx2.icon-help410.floppy` (re-pinned after the QNX 2 date fix).

[meta]
tier = 2
group = "flux.scp-hfe"
description = "Open SCP and HFE flux images as disk images."

[[case]]
id = "read.flux.scp-icon-help410"
description = "Greaseweazle SCP decodes to the help disk's QNX 2 volume"
fixture = "flux.scp.icon-help410.floppy"
timeout_ms = 300000
[[case.step]]
args = ["inspect", "{fixture}"]
expect_exit = 0
stdout_contains = ["QNX2", "800.0 KiB"]
stderr_not_contains = ["unreadable"]
[[case.step]]
args = ["tar", "{fixture}", "/", "{scratch}/all.tar"]
expect_exit = 0
file_sha256 = [{ path = "{scratch}/all.tar", sha256 = "24bc09805c2ef624a0b0913ced8a747b96eac33e0d20d1fd4ae9241c547d2795" }]

[[case]]
id = "read.flux.hfe-icon-help410"
description = "HFE v1 bitstream decodes to the same volume"
fixture = "flux.hfe.icon-help410.floppy"
