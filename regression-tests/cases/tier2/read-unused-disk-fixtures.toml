# Tier 2 — the disk-image fixtures nothing was using.
#
# `rb-regress fixtures` reported 43 present fixtures that no case referenced.
# They were bought, catalogued, checksummed and copied to every machine, and
# then nothing looked at them. This file covers the 31 that are disk images;
# the optical dozen are in read-unused-optical-fixtures.toml.
#
# The assertion is deliberately shallow — open it, identify it, walk the root.
# That is what a *read* fixture is for: proving we can still open real media we
# did not create. Depth belongs in the tier-3 edit cases, which use a
# {fixture_copy} because they mutate.
#
# ENCRYPTED FIXTURES: the convention is that the password is `password`.
# Verified 2026-08-08 — the Ghost image conforms. The encrypted APFS volume
# does NOT: it was built with `rbtest-apfs`, a throwaway constant, before the
# convention existed. Its case uses the value that actually works and is
# flagged below, because a case that fails on a passphrase mismatch looks
# exactly like a decryption defect.

[meta]
tier = 2
group = "fs.read.unused"
description = "Open every catalogued disk fixture that had no case."

# --- Amiga ---------------------------------------------------------------------

[[case]]
id = "read.adf.amiga-dd"
fixture = "fmt.adf.amiga-dd.floppy"
[[case.step]]
args = ["inspect", "{fixture}"]
expect_exit = 0
[[case.step]]
args = ["ls", "{fixture}", "/"]
expect_exit = 0

[[case]]
id = "read.adf.bootblock-ndos"
description = "A custom-bootblock disk with no filesystem — must classify as NDOS and reach the carve view, not face-plant in the AFFS parser"
fixture = "fmt.adf.bootblock-ndos.floppy"
[[case.step]]
args = ["inspect", "{fixture}"]
expect_exit = 0
stdout_contains = ["NDOS"]

