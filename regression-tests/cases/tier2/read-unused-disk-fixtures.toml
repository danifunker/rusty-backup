[[case]]
id = "read.hfsplus.journal-dirty"
description = "A DIRTY journal. The interesting one: an unreplayed journal means the on-disk state is stale, and reading it as if it were clean is how a backup silently captures the wrong bytes."
fixture = "fs.hfsplus.journal-dirty.hd"
[[case.step]]
args = ["inspect", "{fixture}"]
expect_exit = 0
[[case.step]]
args = ["fsck", "{fixture}", "--checkonly"]
expect_exit = 0

