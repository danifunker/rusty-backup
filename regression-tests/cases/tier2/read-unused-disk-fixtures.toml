# The three encrypted-APFS fixtures below hold the SAME tree with the SAME file
# bytes, under two different passphrases and two different container shapes.
# Each `unlocked` case asserts the same five sha256s, so a KEK unwrap that
# returns plausible garbage fails on content rather than passing on exit 0.
# The plaintext hashes are the shared constant; do not edit one copy alone.

[[case]]
id = "read.apfs.encrypted.unlocked"
description = """FileVault decrypt. NOTE: the passphrase is `rbtest-apfs`, not the
`password` convention — this fixture predates it and is kept for the extra
coverage a second passphrase buys. The conforming replacements are
fs.apfs.encrypted-gpt.hd and fs.apfs.encrypted-bare.hd."""
fixture = "fs.apfs.encrypted.hd"
[[case.step]]
args = ["ls", "{fixture}", "/", "--password", "rbtest-apfs"]
expect_exit = 0
stdout_contains = ["hello.txt", "medium.txt", "big.bin", "link_to_hello", "docs"]
[[case.step]]
args = ["get", "{fixture}", "/hello.txt", "{scratch}/hello.txt", "--password", "rbtest-apfs"]
expect_exit = 0
file_sha256 = [{ path = "{scratch}/hello.txt", sha256 = "3c74c11f53769169dab4810549bb5f1d46cbf71da66ca4ff39d29e36aa870228" }]
[[case.step]]
args = ["get", "{fixture}", "/medium.txt", "{scratch}/medium.txt", "--password", "rbtest-apfs"]
expect_exit = 0
file_sha256 = [{ path = "{scratch}/medium.txt", sha256 = "b7fe4febe239781976b258506989f566502a8aec1a5dff4b1a19a2dcc7466233" }]
[[case.step]]
args = ["get", "{fixture}", "/big.bin", "{scratch}/big.bin", "--password", "rbtest-apfs"]
expect_exit = 0
file_sha256 = [{ path = "{scratch}/big.bin", sha256 = "e9c4c182616951b8f95c7881e13d11563c5c726c7f7cec6c92573d8048684b91" }]
[[case.step]]
args = ["get", "{fixture}", "/docs/readme.md", "{scratch}/readme.md", "--password", "rbtest-apfs"]
expect_exit = 0
file_sha256 = [{ path = "{scratch}/readme.md", sha256 = "e572aeb222ba1eca7a0a4ebd98617ea9ed6ee6d4c99bb72456c29faab94f3191" }]
[[case.step]]
args = ["get", "{fixture}", "/docs/nested/deep.txt", "{scratch}/deep.txt", "--password", "rbtest-apfs"]
expect_exit = 0
file_sha256 = [{ path = "{scratch}/deep.txt", sha256 = "30cf6f2de471343739bcc1dde393c0c0771814ac3ad798f68c8a74495174521a" }]

