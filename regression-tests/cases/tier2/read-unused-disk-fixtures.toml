[[case]]
id = "read.apfs.encrypted.locked"
description = "Locked: identifying the container without a passphrase must still work"
fixture = "fs.apfs.encrypted.hd"
[[case.step]]
args = ["inspect", "{fixture}"]
expect_exit = 0
stdout_contains = ["APFS"]

[[case]]
id = "read.apfs.encrypted.unlocked"
description = """FileVault decrypt. NOTE: the passphrase is `rbtest-apfs`, not the
`password` convention — this fixture predates it. Standardising means rebuilding
the volume on the Mac; until then this value is the one that works, and hard-coding
`password` here would produce a KEK-unwrap failure that reads like a decryption bug."""
fixture = "fs.apfs.encrypted.hd"
[[case.step]]
args = ["ls", "{fixture}", "/", "--password", "rbtest-apfs"]
expect_exit = 0
stdout_contains = ["hello.txt"]

[[case]]
id = "read.apfs.encrypted.wrong-passphrase-is-an-error"
description = "A wrong passphrase must fail loudly rather than returning garbage"
fixture = "fs.apfs.encrypted.hd"
[[case.step]]
args = ["ls", "{fixture}", "/", "--password", "not-the-passphrase"]
expect_exit = 1

