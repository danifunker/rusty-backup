# --- WinImage IMA / IMZ -----------------------------------------------------
# formats.toml recorded the requirement and nothing acted on it:
#   "Encrypted variant needs both a correct- and a wrong-password case"
#
# All three fixtures hold the SAME 1.44 MB FAT12 volume: the raw .IMA, the
# plain .IMZ, and the password-protected .IMZ. That is what makes the encrypted
# case worth having — asserting a shared file from the volume proves the
# decrypt produced the CORRECT plaintext, not merely that it returned something
# without erroring. A decrypt that yields plausible-but-wrong bytes is the
# failure mode that silently corrupts a restore, and exit 0 alone cannot see it.
#
# Password is `password`, per the convention. Produced by WinImage, the
# canonical tool, rather than synthesised here.

[[case]]
id = "read.ima.transferdisk"
description = "The raw plaintext behind both IMZ fixtures"
fixture = "fmt.ima.transferdisk.floppy"
[[case.step]]
args = ["inspect", "{fixture}"]
expect_exit = 0
stdout_contains = ["FAT"]
[[case.step]]
args = ["ls", "{fixture}", "/"]
expect_exit = 0
stdout_contains = ["bcwdef.csm", "makefile"]

[[case]]
id = "read.imz.plain"
description = "An unencrypted IMZ must decode to the same volume as the .IMA"
fixture = "fmt.imz.transferdisk.floppy"
[[case.step]]
args = ["inspect", "{fixture}"]
expect_exit = 0
stdout_contains = ["FAT"]
[[case.step]]
args = ["ls", "{fixture}", "/"]
expect_exit = 0
stdout_contains = ["bcwdef.csm", "makefile"]

[[case]]
id = "read.imz.encrypted.refuses-without-password"
description = "Must say it needs a password, and name the entry, rather than failing obscurely"
fixture = "fmt.imz.encrypted.floppy"
[[case.step]]
args = ["inspect", "{fixture}"]
expect_exit = 1
stdout_contains = ["password-protected"]

[[case]]
id = "read.imz.encrypted.opens-with-password"
description = "Decrypts to the SAME volume as the plain pair — the assertion that matters"
fixture = "fmt.imz.encrypted.floppy"
[[case.step]]
args = ["inspect", "{fixture}", "--password", "password"]
expect_exit = 0
stdout_contains = ["FAT"]
[[case.step]]
