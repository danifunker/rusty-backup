# Tier 2 — GitHub issue #89 ("Falcon"): an Atari Falcon disk and two
# ShapeShifter (Mac-on-Amiga) hardfiles from a Minimig. Each failed a
# different way before the fix:
#
#   fmt.ahdi.falcon-bgm.hd           AHDI table with one BGM partition whose
#                                    boot sector starts 60 1C (68000 BRA.S),
#                                    not an x86 jump. The FAT reader refused it:
#                                    "invalid FAT boot sector: bad jump
#                                    instruction". Logical sectors are 2048 B.
#
#   part.rdb.shapeshifter-raw-hfs.hd Both RDB partitions are declared PFS\3 but
#                                    hold raw classic HFS (boot "LK", MDB "BD"):
#                                    ShapeShifter uses the partitions directly.
#                                    PFS3 refused them ("boot magic = 4c4b6000").
#                                    Now routed by content, labelled
#                                    "HFS (SST01, declared PFS\3)".
#
#   part.rdb.shapeshifter-hardfiles.hd  Real PFS\3 partitions; the Mac drives
#                                    are 2 GB hardfiles inside one of them
#                                    (/ShapeShifter/HardFiles/CH1.dsk, CH2.dsk),
#                                    each a bare HFS volume. Opening one is the
#                                    GUI's "Open as Disk Image" (Inspect) and
#                                    Commander descend; on the CLI it's `get`
#                                    then `inspect`. Copying 2 GB out isn't a
#                                    tier-2 step, so only the listing is pinned.
#
# Not pinned: `fsck` on raw-hfs @1 reports 696 FreeNodeNotErased errors, which
# looks like an HFS+ rule misapplied to classic HFS (tracked separately).
#
# Streams: the `Partition @N ...` banner goes to stderr; assert on stdout.

[meta]
tier = 2
group = "fs.read.issue89"
description = "Open, identify, walk and fsck the issue #89 Falcon + ShapeShifter drop."

# --- Atari Falcon, AHDI BGM ---------------------------------------------------

[[case]]
id = "read.ahdi.falcon-bgm"
description = "Atari Falcon AHDI disk: a BGM partition with a 68000 BRA.S boot sector and 2048-byte logical sectors."
fixture = "fmt.ahdi.falcon-bgm.hd"
[[case.step]]
args = ["inspect", "{fixture}"]
expect_exit = 0
stdout_contains = ["Partition table: AHDI", "AHDI BGM"]
[[case.step]]
args = ["ls", "{fixture}@1", "/"]
expect_exit = 0
stdout_contains = ["AUTO", "CONFIG", "GAMES", "HDX"]
[[case.step]]
args = ["fsck", "{fixture}@1", "--checkonly"]
expect_exit = 0
stdout_contains = ["326 files / 26 dirs"]

# --- ShapeShifter: raw HFS under a PFS\3 DosType ------------------------------

[[case]]
id = "read.rdb.shapeshifter-raw-hfs"
description = "Minimig RDB whose PFS\\3 partitions hold raw classic HFS: routed by content, not by the declared DosType."
fixture = "part.rdb.shapeshifter-raw-hfs.hd"
[[case.step]]
args = ["inspect", "{fixture}"]
expect_exit = 0
stdout_contains = ["Partition table: RDB", "HFS (SST01, declared PFS\\3)", "HFS (SST02, declared PFS\\3)"]
stdout_not_contains = ["PFS (Amiga)"]
[[case.step]]
args = ["ls", "{fixture}@1", "/"]
expect_exit = 0
stdout_contains = ["Applications", "Desktop Folder", "Extras"]
[[case.step]]
args = ["ls", "{fixture}@2", "/"]
expect_exit = 0
stdout_contains = ["8.1 Extras"]
[[case.step]]
args = ["fsck", "{fixture}@2", "--checkonly"]
expect_exit = 0
stdout_contains = ["1928 files / 270 dirs"]

# --- ShapeShifter: Mac hardfiles inside PFS -----------------------------------

[[case]]
id = "read.rdb.shapeshifter-hardfiles"
description = "Minimig RDB with real PFS\\3 partitions; the ShapeShifter Mac drives are 2 GB hardfiles inside DH1."
fixture = "part.rdb.shapeshifter-hardfiles.hd"
[[case.step]]
args = ["inspect", "{fixture}"]
expect_exit = 0
stdout_contains = ["Partition table: RDB", "PFS (Amiga) (DH0)", "PFS (Amiga) (DH1)"]
[[case.step]]
args = ["ls", "{fixture}@2", "/ShapeShifter/HardFiles"]
expect_exit = 0
stdout_contains = ["CH1.dsk", "CH2.dsk", "2097152000"]
