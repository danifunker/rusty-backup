# --- Audio -------------------------------------------------------------------------
# This was authored as a second R-012 case on the strength of the fixture's name
# and listed as a known failure. It is not one — the disc has an ISO 9660 data
# track, so it never exercised "no data track" and passed the moment it first
# ran. R-012 is pinned by optical.cdda.no-data-track-opens, which is a real
# pure-CD-DA cue/bin. The corpus still has no CD-DA-only CHD.

[[case]]
id = "read.optical.chdcd.audio-test"
description = "A CD inside a CHD. Named for its AUDIOTST volume label, but it carries an ISO 9660 data track — it is not the pure-CD-DA case R-012 is about."
fixture = "optical.chdcd.audio-test.cd"
timeout_ms = 300000
[[case.step]]
args = ["optical", "info", "{fixture}"]
expect_exit = 0
