# Tier 2 — the optical fixtures nothing was using.
#
# Twelve of the 43 unreferenced fixtures are discs. They are the most expensive
# part of the corpus by far — most of the 3.7 GB — and nothing was reading them.
#
# `optical info` identifies the container and its filesystems; `optical browse`
# walks the tree. Both together are the difference between "the header parses"
# and "we can actually get at the contents", which is the whole claim.
#
# GAPS.md § Next actions put optical last, "and most carefully". These are read
# cases only — nothing here writes.

[meta]
tier = 2
group = "optical.read.unused"
description = "Open every catalogued optical fixture that had no case."

# --- ISO 9660 family ------------------------------------------------------------

[[case]]
id = "read.optical.iso9660.joliet"
description = "Joliet supplies a second, Unicode name for every entry; browsing must prefer it rather than the 8.3 fallback"
fixture = "optical.iso9660.joliet.cd"
timeout_ms = 300000
[[case.step]]
args = ["optical", "info", "{fixture}"]
expect_exit = 0
[[case.step]]
args = ["optical", "browse", "{fixture}", "/"]
expect_exit = 0

