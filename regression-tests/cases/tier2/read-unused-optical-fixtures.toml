# --- Audio -------------------------------------------------------------------------
# R-012 says `optical info` rejects any disc with no data track. This fixture is
# exactly that shape, so the case asserts the intended behaviour and is expected
# to be red until R-012 is fixed. It is listed in known-failures.toml against
# R-012 for that reason, not because the fixture is at fault.

[[case]]
id = "read.optical.chdcd.audio-test"
description = "A pure CD-DA disc inside a CHD. R-012: we reject it for having no data track, which is wrong — an audio disc is a disc."
fixture = "optical.chdcd.audio-test.cd"
timeout_ms = 300000
[[case.step]]
args = ["optical", "info", "{fixture}"]
expect_exit = 0
