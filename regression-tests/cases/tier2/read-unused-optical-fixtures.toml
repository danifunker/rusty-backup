# Tier 2 — the optical fixtures nothing was using.
#
# Twelve of the 43 unreferenced fixtures are discs. They are the most expensive
# part of the corpus by far — most of the 3.7 GB — and nothing was reading them.
#
# `optical info` identifies the container and its filesystems; `optical browse`
# walks the tree. Both together are the difference between "the header parses"
# and "we can actually get at the contents", which is the whole claim.
#
# The browse steps originally asserted exit 0 and nothing else, which cannot
# tell a correct tree from an empty one. Each now names an entry that is
# actually on that disc. Three of them go further and extract, hashing the
# result — those are the discs small enough that a full extract is cheap.
#
# GAPS.md § Next actions put optical last, "and most carefully". These are read
# cases only — nothing here writes.

[meta]
tier = 2
group = "optical.read.unused"
description = "Open every catalogued optical fixture that had no case."

# --- ISO 9660 family ------------------------------------------------------------

[[case]]
id = "read.optical.iso9660.joliet"
description = "Joliet supplies a second, Unicode name for every entry; browsing must prefer it rather than the 8.3 fallback"
fixture = "optical.iso9660.joliet.cd"
timeout_ms = 300000
[[case.step]]
args = ["optical", "info", "{fixture}"]
expect_exit = 0
[[case.step]]
args = ["optical", "browse", "{fixture}"]
expect_exit = 0
stdout_contains = ["CIV_II_GOLD_111_UPDATE.SIT"]
[[case.step]]
# The extracted name is the Joliet one, not the 8.3 fallback — that is the assertion the fixture exists for.
args = ["optical", "extract", "{fixture}", "--to", "{scratch}/ex", "--resource-forks", "data-only"]
expect_exit = 0
file_sha256 = [{ path = "{scratch}/ex/CIV_II_GOLD_111_UPDATE.SIT", sha256 = "cb251f01aef8b05198f80b14db9a583258908849181a8ef71ac8880c92b28244" }]

[[case]]
id = "read.optical.iso9660.hybrid-rsrc"
description = "A hybrid disc carrying Mac resource forks alongside the ISO tree"
fixture = "optical.iso9660.hybrid-rsrc.cd"
