file_sha256 = [{ path = "{scratch}/info", sha256 = "d29d305cf6ac753aa41c95c52f34c34dbb0222b51f14e8c0f9eea724107d9a28" }]

[[case]]
id = "read.ndif.adc.issue99-damaged-laserwriter"
description = "A data fork whose first 10752 bytes repeat a later CD block: bad chunks read as zeros, with a warning"
fixture = "ndif.adc.issue99-laserwriter-disk1"
[[case.step]]
args = ["ls", "{fixture}", "/"]
expect_exit = 0
stderr_contains = ["chunk 1 (sectors 4-35, type 0x83 ADC) does not decode", "read as zeros", "data fork is damaged", "CRC"]
stdout_contains = ["whole-disk.img"]

[[case]]
id = "read.ndif.adc.issue99-damaged-colorsw"
