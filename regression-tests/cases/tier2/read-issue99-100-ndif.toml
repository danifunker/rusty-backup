[[case.step]]
args = ["ls", "{fixture}", "/"]
expect_exit = 0
stderr_contains = ["chunk 1 (sectors 4-35, type 0x83 ADC) does not decode", "read as zeros"]
stdout_contains = ["whole-disk.img"]

[[case]]
id = "read.ndif.adc.issue99-damaged-installmefirst"
