[[case]]
id = "fs.read.cpc-amsdos"
description = "real-world EDSK from TOSEC — the messy-container case"
fixture = "fs.cpc.amsdos.floppy"
# CP/M has no on-disk signature, so the DPB must be named explicitly. Note
# `inspect` exposes no --fs-type (see COVERAGE.md R-010), so the read path for
# signature-less filesystems goes through `ls` / `fsck` instead.
[[case.step]]
args = ["ls", "{fixture}", "--fs-type", "cpm:amstrad_data"]
expect_exit = 0
stdout_contains = ["MANIC.BAS", "MANIC.BIN"]

