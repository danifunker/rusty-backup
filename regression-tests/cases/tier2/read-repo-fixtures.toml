# --- Partition schemes -------------------------------------------------------

[[case]]
id = "part.read.ahdi"
description = "Atari AHDI — one of the two schemes missing from the README table (R-001)"
fixture = "part.ahdi.base.multipart"
# NB: `show partmap` is APM-only by design (docs/cli-reference.md), so the
# per-scheme partition-table assertion goes through `inspect`, not partmap.
[[case.step]]
args = ["inspect", "{fixture}", "--format", "json"]
expect_exit = 0
expect_envelope_ok = true
stdout_contains = ["AHDI"]

[[case]]
id = "part.read.ahdi.both-partitions"
description = "AHDI GEM (FAT12) and BGM (FAT16) partitions are both walkable"
fixture = "part.ahdi.base.multipart"
[[case.step]]
args = ["ls", "{fixture}@1", "/"]
expect_exit = 0
[[case.step]]
args = ["ls", "{fixture}@2", "/"]
expect_exit = 0
