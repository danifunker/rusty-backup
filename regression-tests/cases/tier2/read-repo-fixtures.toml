# Tier 2 — read and inspect, backed entirely by fixtures already committed to
# the repository.
#
# Every fixture referenced here resolves through a `repo:` row in
# fixture-map.repo.tsv, so this file runs on a bare clone with **no NAS, no
# network and no downloads**. That is the whole point: the corpus we have to
# distribute should be as close to zero as we can make it.
#
# Cases live here only for filesystems and containers `rb-cli` cannot build
# itself. Anything the engine can synthesize belongs in tier 1 instead — see
# FIXTURES.md § Minimum corpus.

[meta]
tier = 2
group = "fs.read"
description = "Read-side coverage for filesystems with no builder, from repo fixtures."

# --- Filesystems with no `new` builder ---------------------------------------

[[case]]
id = "fs.read.exfat"
description = "exFAT — no builder exists, so this must come from a fixture"
fixture = "fs.exfat.base.hd"
[[case.step]]
args = ["inspect", "{fixture}", "--format", "json"]
expect_exit = 0
expect_envelope_ok = true
json_exists = ["partitions"]

