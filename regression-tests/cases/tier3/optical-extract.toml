# Tier 3 — `optical extract` beyond "it extracted something".
#
# The optical fixtures were asserted shallowly for a long time: `info` opened
# and `browse` listed, which proves a disc parses and proves nothing about the
# bytes coming back off it. These pull files out and check them.
#
# `optical.iso9660.joliet.cd` is the workhorse: one file at the root of an ISO
# 9660 volume, so a single-file extract is unambiguous and the whole-disc form
# has exactly one entry to produce. Its sha256 is the anchor — a truncated or
# mis-offset read fails on content rather than on exit code.

[meta]
tier = 3
group = "optical.extract"
description = "Single-file, folder, archive and filesystem-selection extraction."

[[case]]
id = "optical.extract.whole-disc"
description = "The existing whole-disc form still works, unchanged by --path"
fixture = "optical.iso9660.joliet.cd"
timeout_ms = 300000
[[case.step]]
args = ["optical", "extract", "{fixture}", "--to", "{scratch}/all"]
expect_exit = 0
[[case.step]]
args = ["optical", "browse", "{fixture}"]
expect_exit = 0
files_exist = ["{scratch}/all/CIV_II_GOLD_111_UPDATE.SIT"]

[[case]]
id = "optical.extract.single-file-by-path"
description = "--path pulls one named file, and the bytes match the whole-disc extract"
fixture = "optical.iso9660.joliet.cd"
timeout_ms = 300000
[[case.step]]
args = [
  "optical", "extract", "{fixture}",
  "--to", "{scratch}/one",
  "--path", "/CIV_II_GOLD_111_UPDATE.SIT",
]
expect_exit = 0
file_sha256 = [
  { path = "{scratch}/one/CIV_II_GOLD_111_UPDATE.SIT", sha256 = "cb251f01aef8b05198f80b14db9a583258908849181a8ef71ac8880c92b28244" },
]

[[case]]
id = "optical.extract.path-is-case-insensitive"
description = "ISO 9660 upper-cases names; a user reads them off browse and should not have to match case"
fixture = "optical.iso9660.joliet.cd"
timeout_ms = 300000
[[case.step]]
args = [
  "optical", "extract", "{fixture}",
  "--to", "{scratch}/ci",
  "--path", "/civ_ii_gold_111_update.sit",
]
expect_exit = 0
files_exist = ["{scratch}/ci/CIV_II_GOLD_111_UPDATE.SIT"]

[[case]]
id = "optical.extract.missing-path-is-not-found"
description = "A path that is not on the disc exits 3, and leaves no destination behind"
fixture = "optical.iso9660.joliet.cd"
timeout_ms = 300000
[[case.step]]
args = [
  "optical", "extract", "{fixture}",
  "--to", "{scratch}/nope",
  "--path", "/NO/SUCH/FILE.TXT",
]
expect_exit = 3

[[case]]
id = "optical.extract.tar-archive"
description = "The archive form writes a readable gzip tarball rather than loose files"
fixture = "optical.iso9660.joliet.cd"
timeout_ms = 300000
[[case.step]]
args = ["optical", "extract", "{fixture}", "--tar", "{scratch}/disc.tar.gz"]
expect_exit = 0
files_exist = ["{scratch}/disc.tar.gz"]

[[case]]
id = "optical.extract.tar-and-to-are-exclusive"
description = "Two destinations is a usage error, not a silent preference for one"
fixture = "optical.iso9660.joliet.cd"
timeout_ms = 300000
[[case.step]]
args = [
  "optical", "extract", "{fixture}",
  "--to", "{scratch}/both",
  "--tar", "{scratch}/both.tar",
]
expect_exit = 2

[[case]]
id = "optical.extract.needs-a-destination"
description = "Neither --to nor --tar is a usage error rather than a no-op success"
fixture = "optical.iso9660.joliet.cd"
timeout_ms = 300000
[[case.step]]
args = ["optical", "extract", "{fixture}"]
expect_exit = 2

[[case]]
id = "optical.extract.filesystem-index-out-of-range"
description = "An index past the end names the real limit and points at `optical info`, rather than opening the wrong volume"
fixture = "optical.iso9660.joliet.cd"
timeout_ms = 300000
[[case.step]]
args = [
  "optical", "extract", "{fixture}",
  "--to", "{scratch}/ix",
  "--filesystem-index", "9",
]
expect_exit = 2
stderr_contains = ["out of range"]

[[case]]
id = "optical.extract.hfs-refused-on-a-pc-disc"
description = "Asking for the Mac side of a disc that has none must say so, not silently extract the ISO tree"
fixture = "optical.iso9660.joliet.cd"
timeout_ms = 300000
[[case.step]]
args = [
  "optical", "extract", "{fixture}",
  "--to", "{scratch}/hfs",
  "--filesystem", "hfs",
]
expect_exit = 1
stderr_contains = ["no HFS filesystem"]

# --- F-007: recursion, finally testable -------------------------------------
# `--path DIR --recursive` shipped with F-001 and was never verified, because
# every optical fixture in the corpus was flat — `optical.iso9660.joliet.cd`
# holds one file and no directories at all, which makes it a clean single-file
# test and a useless recursion test.
#
# `optical.hfs.opentransport.cd` has a real tree: `/Install 1` holds both files
# and a subdirectory (`Open Transport Files`), so the flag has something to
# descend into and the two modes give different answers.
#
# The count line goes to STDERR, not stdout — `extract` keeps stdout clean for
# data. Checking stdout silently matches nothing and the case fails with no
# visible difference between expected and actual.
#
# The counts are exact on purpose. "Recursive found more" would pass if
# recursion silently degraded from a subtree to one extra file; pinning 10 and
# 30 against a sha256-pinned fixture says precisely what each mode covers, and
# a change in either direction is worth a failure.

[[case]]
id = "optical.extract.path-dir-stops-at-one-level"
description = "F-007: --path DIR without --recursive extracts that directory's own entries and does not descend"
fixture = "optical.hfs.opentransport.cd"
timeout_ms = 300000
[[case.step]]
args = [
  "optical", "extract", "{fixture}",
  "--to", "{scratch}/flat",
  "--path", "/Install 1",
]
expect_exit = 0
stderr_contains = ["extracted 10 entry/entries"]

[[case]]
id = "optical.extract.path-dir-recursive-descends"
description = "F-007: the same path with --recursive pulls the nested subtree too — 30 entries against the same disc"
fixture = "optical.hfs.opentransport.cd"
timeout_ms = 300000
[[case.step]]
args = [
  "optical", "extract", "{fixture}",
  "--to", "{scratch}/rec",
  "--path", "/Install 1",
  "--recursive",
]
expect_exit = 0
stderr_contains = ["extracted 30 entry/entries"]

[[case]]
id = "optical.extract.nested-dir-addressable-directly"
description = "F-007: the subdirectory that recursion reaches can also be named on its own, so the tree is genuinely navigable and not a flattening artifact"
fixture = "optical.hfs.opentransport.cd"
timeout_ms = 300000
[[case.step]]
args = [
  "optical", "extract", "{fixture}",
  "--to", "{scratch}/nested",
  "--path", "/Install 1/Open Transport Files",
]
expect_exit = 0
stderr_contains = ["extracted 20 entry/entries"]
