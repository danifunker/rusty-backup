# --- directory operations -----------------------------------------------------

[[case]]
id = "edit.fat.mkdir-nested-put"
description = "mkdir then put into the new directory, then list it"
[[case.step]]
args = ["new", "volume", "fat", "--size", "4M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["mkdir", "{scratch}/v.img", "/sub"]
expect_exit = 0
[[case.step]]
args = ["put", "{scratch}/v.img", "{cases}/tier3/payload.bin", "/sub/payload.bin"]
expect_exit = 0
[[case.step]]
args = ["ls", "{scratch}/v.img", "/sub"]
expect_exit = 0
stdout_contains = ["payload.bin"]
[[case.step]]
args = ["get", "{scratch}/v.img", "/sub/payload.bin", "{scratch}/out.bin"]
expect_exit = 0
files_identical = [["{cases}/tier3/payload.bin", "{scratch}/out.bin"]]
[[case.step]]
args = ["fsck", "{scratch}/v.img", "--checkonly"]
expect_exit = 0

[[case]]
id = "edit.fat.rm-removes-it"
description = "rm must delete the entry AND leave the volume sound"
[[case.step]]
args = ["new", "volume", "fat", "--size", "4M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["put", "{scratch}/v.img", "{cases}/tier3/payload.bin", "/gone.bin"]
expect_exit = 0
[[case.step]]
args = ["rm", "{scratch}/v.img", "/gone.bin"]
expect_exit = 0
[[case.step]]
args = ["ls", "{scratch}/v.img", "/"]
expect_exit = 0
stdout_not_contains = ["gone.bin"]
[[case.step]]
args = ["fsck", "{scratch}/v.img", "--checkonly"]
expect_exit = 0

[[case]]
id = "edit.ext4.rm-removes-it"
[[case.step]]
