# Tier 3 — the edit surface.
#
# README advertises edit mode on about twenty filesystems. Before this file,
# not one of put / get / rm / mkdir / cp / du / tar / untar / setvolname was
# invoked anywhere in the suite (COMMAND-COVERAGE.md). Every write path beyond
# "format a blank volume" was unverified.
#
# The shape: write something, read it back, prove the bytes match, then fsck.
# The fsck matters as much as the read-back — a driver can return the right
# file while leaving the allocation structures inconsistent, and only the fsck
# would notice.
#
# `{cases}/tier3/payload.bin` is a committed file, so these need no fixture
# corpus and run on a bare clone.

[meta]
tier = 3
group = "edit"
description = "Write to a volume, read it back unchanged, and leave it sound."

# --- put / get round-trip, per filesystem ------------------------------------

[[case]]
id = "edit.fat.put-get"
description = "FAT: put a file, get it back byte-identical, fsck clean"
[[case.step]]
args = ["new", "volume", "fat", "--size", "4M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["put", "{scratch}/v.img", "{cases}/tier3/payload.bin", "/payload.bin"]
expect_exit = 0
[[case.step]]
args = ["get", "{scratch}/v.img", "/payload.bin", "{scratch}/out.bin"]
expect_exit = 0
files_identical = [["{cases}/tier3/payload.bin", "{scratch}/out.bin"]]
[[case.step]]
args = ["fsck", "{scratch}/v.img", "--checkonly"]
expect_exit = 0

