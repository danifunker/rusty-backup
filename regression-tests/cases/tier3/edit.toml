expect_exit = 0

# --- cross-image copy ----------------------------------------------------------

[[case]]
id = "edit.cp.across-filesystems"
description = "cp from a FAT volume into an ext4 one — the bytes must survive the crossing"
[[case.step]]
args = ["new", "volume", "fat", "--size", "4M", "{scratch}/a.img"]
expect_exit = 0
[[case.step]]
args = ["new", "volume", "ext4", "--size", "8M", "{scratch}/b.img"]
expect_exit = 0
[[case.step]]
args = ["put", "{scratch}/a.img", "{cases}/tier3/payload.bin", "/payload.bin"]
expect_exit = 0
[[case.step]]
args = ["cp", "{scratch}/a.img", "/payload.bin", "{scratch}/b.img", "/payload.bin"]
expect_exit = 0
[[case.step]]
args = ["get", "{scratch}/b.img", "/payload.bin", "{scratch}/out.bin"]
expect_exit = 0
files_identical = [["{cases}/tier3/payload.bin", "{scratch}/out.bin"]]
[[case.step]]
args = ["fsck", "{scratch}/b.img", "--checkonly"]
expect_exit = 0

# --- du / locate ---------------------------------------------------------------

[[case]]
id = "edit.du.reports-written-bytes"
description = "du must account for a file that was just written"
[[case.step]]
args = ["new", "volume", "fat", "--size", "4M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["put", "{scratch}/v.img", "{cases}/tier3/payload.bin", "/payload.bin"]
expect_exit = 0
[[case.step]]
args = ["du", "{scratch}/v.img"]
expect_exit = 0
stdout_not_contains = ["0 B         0 B"]

[[case]]
id = "edit.locate.finds-a-written-file"
description = "locate is classic-HFS only today, so this targets HFS deliberately"
[[case.step]]
args = ["new", "volume", "hfs", "--size", "4M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["put", "{scratch}/v.img", "{cases}/tier3/payload.bin", "/needle.bin"]
expect_exit = 0
[[case.step]]
args = ["locate", "{scratch}/v.img", "needle.bin"]
expect_exit = 0
stdout_contains = ["needle.bin"]

# --- tar / untar ---------------------------------------------------------------

[[case]]
id = "edit.tar.export-then-reimport"
description = "tar a directory out, untar it back into a fresh volume, compare the file"
[[case.step]]
args = ["new", "volume", "fat", "--size", "4M", "{scratch}/a.img"]
expect_exit = 0
[[case.step]]
args = ["put", "{scratch}/a.img", "{cases}/tier3/payload.bin", "/payload.bin"]
expect_exit = 0
[[case.step]]
args = ["tar", "{scratch}/a.img", "/", "{scratch}/out.tar"]
expect_exit = 0
files_exist = ["{scratch}/out.tar"]
[[case.step]]
args = ["new", "volume", "fat", "--size", "4M", "{scratch}/b.img"]
expect_exit = 0
[[case.step]]
args = ["untar", "{scratch}/b.img", "{scratch}/out.tar", "/"]
expect_exit = 0
[[case.step]]
args = ["get", "{scratch}/b.img", "/payload.bin", "{scratch}/out.bin"]
expect_exit = 0
files_identical = [["{cases}/tier3/payload.bin", "{scratch}/out.bin"]]

# --- volume metadata -----------------------------------------------------------

[[case]]
id = "edit.setvolname.takes-effect"
description = "setvolname is HFS-only today (its own --help says so), so this targets HFS"
[[case.step]]
args = ["new", "volume", "hfs", "--size", "4M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["setvolname", "{scratch}/v.img", "RENAMED"]
expect_exit = 0
[[case.step]]
args = ["show", "fs-info", "{scratch}/v.img"]
expect_exit = 0
stdout_contains = ["RENAMED"]
