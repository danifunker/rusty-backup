# Tier 3 — the thousand-file churn, on every filesystem that can hold it.
#
# One directory takes 1000 files; then one more file goes in and comes out;
# then the 1000 go; then one more goes in. Every step ends with a clean fsck.
# The point is the directory / B-tree / inode machinery under a full cycle:
# node splits on the way up, merges, retired leaves and reused inodes on the
# way down, and a first insert into a tree that has emptied. On classic HFS
# this is what found R-060 (a catalog that could not take a 94th file).
#
# `{cases}/tier3/tree1000.tar.gz` is committed: `d/f0001.txt` .. `d/f1000.txt`,
# each a one-line text file, so the cases run on a bare clone. `untar` puts
# them in; a glob `rm` takes them out again in one process.
#
# The files live in a subdirectory because FAT12/16 and ProDOS cap their root
# directories (512 and 51 entries); the others do not care. Classic HFS and
# HFV get 64 MiB: their catalog is sized at format time (0.5 % of the volume,
# hformat's rule) and rb-cli cannot grow it later (F-016), so a 16 MiB volume
# stops at about 600 files.
#
# The same churn with an operating system taking the middle turn (add one,
# delete it, delete the thousand) lives outside this harness, because it needs
# a Mac: `scripts/verify-fs-macos.sh -o H12-hfsplus` (macOS's kernel driver)
# and `scripts/verify-hfs-snow.sh os-churn` (System 7.1's Finder).
#
# Not here: Apple DOS 3.3 (105 catalog entries), CP/M (a fixed directory),
# MFS (a floppy), CBM and Atari DOS (144 / 64 entries), SquashFS (edits are
# rebuilds), Human68k and exFAT (no `new volume` builder; exFAT runs on its
# mandatory fixture at the end).

[meta]
tier = 3
group = "churn"
description = "1000 files in, one in and out, 1000 out, one in; fsck clean after each step."

# --- FAT12 (4 MiB) ------------------------------------------------------------

[[case]]
id = "churn.fat12"
description = "FAT12: 1000 files churn in a subdirectory, fsck clean throughout"
[[case.step]]
args = ["new", "volume", "fat", "--size", "4M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["untar", "{scratch}/v.img", "{cases}/tier3/tree1000.tar.gz"]
expect_exit = 0
[[case.step]]
args = ["fsck", "{scratch}/v.img", "--checkonly"]
expect_exit = 0
[[case.step]]
args = ["put", "{scratch}/v.img", "{cases}/tier3/payload.bin", "/d/extra.bin"]
expect_exit = 0
[[case.step]]
args = ["fsck", "{scratch}/v.img", "--checkonly"]
expect_exit = 0
[[case.step]]
args = ["rm", "{scratch}/v.img", "/d/extra.bin"]
expect_exit = 0
[[case.step]]
args = ["fsck", "{scratch}/v.img", "--checkonly"]
expect_exit = 0
[[case.step]]
args = ["rm", "{scratch}/v.img", "/d/f*.txt"]
expect_exit = 0
[[case.step]]
args = ["fsck", "{scratch}/v.img", "--checkonly"]
expect_exit = 0
[[case.step]]
args = ["put", "{scratch}/v.img", "{cases}/tier3/payload.bin", "/d/last.bin"]
expect_exit = 0
[[case.step]]
args = ["fsck", "{scratch}/v.img", "--checkonly"]
expect_exit = 0
[[case.step]]
args = ["ls", "{scratch}/v.img", "/d"]
expect_exit = 0
stdout_contains = ["last.bin"]
stdout_not_contains = ["f0001.txt", "f1000.txt", "extra.bin"]

