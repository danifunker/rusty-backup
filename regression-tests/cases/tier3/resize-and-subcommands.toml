# Tier 3 — resize, and the subcommand surface nothing had touched.
#
# `resize`, `shrink` and `grow` were never invoked by any case; `expand` ran
# once. Alignment-preserving resize is a stated design goal in CLAUDE.md and
# had no coverage at all. Nor did `squashfs` (five subcommands — the verb R-014
# was about), `partmap`, `show`, `config`, `repack` or `archive`.
#
# Every resize case ends in an fsck. A resize that returns 0 and leaves an
# inconsistent volume is the failure mode that matters, and only the fsck sees
# it.

[meta]
tier = 3
group = "resize"
description = "Grow, shrink and repack volumes; exercise the untouched subcommands."

# --- grow ---------------------------------------------------------------------

[[case]]
id = "resize.grow.fat"
description = "grow --add must enlarge the file and leave a sound filesystem"
[[case.step]]
args = ["new", "volume", "fat", "--size", "8M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["grow", "{scratch}/v.img", "--add", "4M"]
expect_exit = 0
[[case.step]]
# grow reports on stderr, so the size is asserted through inspect.
args = ["inspect", "{scratch}/v.img"]
expect_exit = 0
stdout_contains = ["12.0 MiB"]
[[case.step]]
args = ["fsck", "{scratch}/v.img", "--checkonly"]
expect_exit = 0

[[case]]
id = "resize.grow.preserves-data"
description = "A file written before the grow must still read back identical after it"
[[case.step]]
args = ["new", "volume", "fat", "--size", "8M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["put", "{scratch}/v.img", "{cases}/tier3/payload.bin", "/payload.bin"]
expect_exit = 0
[[case.step]]
args = ["grow", "{scratch}/v.img", "--add", "8M"]
expect_exit = 0
[[case.step]]
args = ["get", "{scratch}/v.img", "/payload.bin", "{scratch}/out.bin"]
expect_exit = 0
files_identical = [["{cases}/tier3/payload.bin", "{scratch}/out.bin"]]
[[case.step]]
args = ["fsck", "{scratch}/v.img", "--checkonly"]
expect_exit = 0

[[case]]
id = "resize.grow.ext4"
[[case.step]]
args = ["new", "volume", "ext4", "--size", "8M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["grow", "{scratch}/v.img", "--add", "8M"]
expect_exit = 0
[[case.step]]
args = ["fsck", "{scratch}/v.img", "--checkonly"]
expect_exit = 0

# --- resize -------------------------------------------------------------------
# Observed 2026-08-08: `resize --size 16M` on a 12 MiB FAT superfloppy printed
# "resize complete" and left the file at 12 MiB. This case asserts the intended
# behaviour — the volume ends up the size that was asked for — so it is red
# until that is either fixed or explained.

[[case]]
id = "resize.to-explicit-size"
description = "resize --size must produce a volume of that size"
[[case.step]]
args = ["new", "volume", "fat", "--size", "8M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["resize", "{scratch}/v.img", "--size", "16M"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/v.img"]
expect_exit = 0
stdout_contains = ["16.0 MiB"]

# --- shrink (R-037) -----------------------------------------------------------
# A shrink used to rewrite the FAT for the smaller volume with live data still
# beyond it, print "resize complete" and exit 0. `get` then returned a silently
# truncated file, also exiting 0. These three pin the whole decision: refuse
# what would cut data, refuse what was not asked for, and keep the data when it
# does run.

[[case]]
id = "resize.shrink.refuses-cutting-live-data"
description = """R-037: a shrink below where the data ends must be refused,
--confirm-shrink or not.

The volume is filled with a 40M zero-allocation so the data genuinely extends
past the 16M target. An earlier draft of this case put the 104-byte payload in
a 64M volume and shrank to 1M, expecting a refusal — the guard allowed it, and
was right to: the file ends around 150 KB, so 1M is beyond it and the data
survived. The guard reads `last_data_byte`; the case has to make the data
actually reach past the target rather than assume it does."""
[[case.step]]
args = ["new", "volume", "fat", "--size", "64M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["put", "{scratch}/v.img", "--zero", "41943040", "--dst", "/BIG.BIN"]
expect_exit = 0
[[case.step]]
args = ["resize", "{scratch}/v.img", "--size", "16M", "--confirm-shrink"]
expect_exit = 2
stderr_contains = ["refusing to shrink"]
# The refusal must be a refusal: the image keeps its length and its file.
[[case.step]]
args = ["inspect", "{scratch}/v.img"]
expect_exit = 0
stdout_contains = ["64.0 MiB"]
[[case.step]]
args = ["fsck", "{scratch}/v.img", "--checkonly"]
expect_exit = 0

[[case]]
id = "resize.shrink.needs-confirmation"
description = "R-037: a safe shrink still needs --confirm-shrink, because truncation is not reversible"
[[case.step]]
args = ["new", "volume", "fat", "--size", "64M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["resize", "{scratch}/v.img", "--size", "40M"]
expect_exit = 2
stderr_contains = ["--confirm-shrink"]
[[case.step]]
args = ["inspect", "{scratch}/v.img"]
expect_exit = 0
stdout_contains = ["64.0 MiB"]

[[case]]
id = "resize.shrink.keeps-data-and-truncates"
description = "R-037: a confirmed, safe shrink resizes the filesystem, truncates the image, and keeps every byte"
[[case.step]]
args = ["new", "volume", "fat", "--size", "64M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["put", "{scratch}/v.img", "{cases}/tier3/payload.bin", "/payload.bin"]
expect_exit = 0
[[case.step]]
args = ["resize", "{scratch}/v.img", "--size", "40M", "--confirm-shrink"]
expect_exit = 0
# The image is truncated, not just the filesystem — a superfloppy's reported
# size is its file length, so this asserts both.
[[case.step]]
args = ["inspect", "{scratch}/v.img"]
expect_exit = 0
stdout_contains = ["40.0 MiB"]
[[case.step]]
args = ["get", "{scratch}/v.img", "/payload.bin", "{scratch}/out.bin"]
expect_exit = 0
files_identical = [["{cases}/tier3/payload.bin", "{scratch}/out.bin"]]
[[case.step]]
args = ["fsck", "{scratch}/v.img", "--checkonly"]
expect_exit = 0

# --- repack -------------------------------------------------------------------

[[case]]
id = "resize.repack.keeps-data"
description = """repack must not lose a file, and must leave the volume sound.

Rewritten 2026-08-09. This built a plain FAT superfloppy and repacked it, which
`repack` was never for — it is documented Human68k-only. The volume opened as
Human68k anyway (the two share a BPB layout, deliberately: X68000 floppies use
the standard MS-DOS one), so the file was rebuilt through a driver with no
long-filename concept and `payload.bin` came back `PAYLOAD.BIN`. The finding
recorded that as "every file is gone"; nothing was lost, the name changed and
the lowercase `get` then missed. The case now uses a real Human68k volume, and
resize.repack.refuses-plain-fat below pins the input it used to accept."""
[[case.step]]
args = ["new", "hd", "x68k", "--size", "16M", "{scratch}/hd.img"]
expect_exit = 0
[[case.step]]
args = ["put", "{scratch}/hd.img@1", "{cases}/tier3/payload.bin", "/payload.bin"]
expect_exit = 0
[[case.step]]
args = ["repack", "{scratch}/hd.img@1"]
expect_exit = 0
[[case.step]]
args = ["get", "{scratch}/hd.img@1", "/payload.bin", "{scratch}/out.bin"]
expect_exit = 0
files_identical = [["{cases}/tier3/payload.bin", "{scratch}/out.bin"]]
[[case.step]]
args = ["fsck", "{scratch}/hd.img@1", "--checkonly"]
expect_exit = 0

[[case]]
id = "resize.repack.refuses-plain-fat"
description = "repack must refuse a plain FAT volume rather than rebuild it through the Human68k driver"
[[case.step]]
args = ["new", "volume", "fat", "--size", "8M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["put", "{scratch}/v.img", "{cases}/tier3/payload.bin", "/payload.bin"]
expect_exit = 0
[[case.step]]
args = ["repack", "{scratch}/v.img"]
expect_exit = 2
stderr_contains = ["is for Human68k"]
# The refusal must be a refusal: the volume is untouched, long name and all.
[[case.step]]
args = ["get", "{scratch}/v.img", "/payload.bin", "{scratch}/out.bin"]
expect_exit = 0
files_identical = [["{cases}/tier3/payload.bin", "{scratch}/out.bin"]]

# --- squashfs -----------------------------------------------------------------
# Five subcommands, none previously exercised — including on the verb whose
# clippy failure was R-014.

[[case]]
id = "subcmd.squashfs.create-verify"
description = "Build an image from a host directory and structurally verify it"
[[case.step]]
args = ["squashfs", "create", "{cases}/tier3", "{scratch}/t.squashfs"]
expect_exit = 0
files_exist = ["{scratch}/t.squashfs"]
[[case.step]]
args = ["squashfs", "verify", "{scratch}/t.squashfs"]
expect_exit = 0
[[case.step]]
args = ["squashfs", "plan", "{scratch}/t.squashfs"]
expect_exit = 0

[[case]]
id = "subcmd.squashfs.roundtrip-a-file"
description = "A file packed into a SquashFS image must read back identical"
[[case.step]]
args = ["squashfs", "create", "{cases}/tier3", "{scratch}/t.squashfs"]
expect_exit = 0
[[case.step]]
args = ["get", "{scratch}/t.squashfs", "/payload.bin", "{scratch}/out.bin"]
expect_exit = 0
files_identical = [["{cases}/tier3/payload.bin", "{scratch}/out.bin"]]

[[case]]
id = "subcmd.squashfs.put-rebuilds"
description = "squashfs put rebuilds the whole image; the added file must be readable"
[[case.step]]
args = ["squashfs", "create", "{cases}/tier3", "{scratch}/t.squashfs"]
expect_exit = 0
[[case.step]]
args = ["squashfs", "put", "{scratch}/t.squashfs", "{cases}/tier3/payload.bin", "/added.bin", "--grow", "1M"]
expect_exit = 0
[[case.step]]
args = ["get", "{scratch}/t.squashfs", "/added.bin", "{scratch}/out.bin"]
expect_exit = 0
files_identical = [["{cases}/tier3/payload.bin", "{scratch}/out.bin"]]

# --- partmap ------------------------------------------------------------------

[[case]]
id = "subcmd.show.partmap"
description = "show partmap must read back the table new hd wrote"
[[case.step]]
args = ["new", "hd", "sgi-efs", "--size", "16M", "{scratch}/d.img"]
expect_exit = 0
[[case.step]]
args = ["show", "partmap", "{scratch}/d.img"]
expect_exit = 0

# --- show / config: read-only introspection ------------------------------------

[[case]]
id = "subcmd.show.fs-info"
[[case.step]]
args = ["new", "volume", "fat", "--size", "2M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["show", "fs-info", "{scratch}/v.img"]
expect_exit = 0
[[case]]
id = "subcmd.config.show"
[[case.step]]
args = ["config", "show"]
expect_exit = 0
