[[case]]
id = "floppy.info.reads-a-container"
description = "A 1232 KB FAT floppy is an X68000 XDF — a flat sector dump at that geometry. A 1440K one is raw and `floppy info` rightly refuses it."
[[case.step]]
args = ["new", "floppy", "fat", "--size", "1232K", "{scratch}/f.xdf"]
expect_exit = 0
[[case.step]]
args = ["floppy", "info", "{scratch}/f.xdf"]
