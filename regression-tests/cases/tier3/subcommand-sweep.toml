# Tier 3 — the rest of the command surface.
#
# Second authoring pass over COMMAND-COVERAGE.md's never-invoked list: archive,
# cbk, xattr, chmod/chown/chmeta, reformat, import, edit, expand, the Mac
# encodings, bless, make-bootable, optical and floppy.
#
# Deliberately NOT covered here, with reasons, so the absence is a decision
# rather than an oversight:
#
#   menu, terminal, tui   interactive; no scriptable surface
#   completions,
#   install-completions   shell integration, not disk behaviour
#   update                reaches the network; would make the suite
#                         non-deterministic and fail offline
#   serve                 a daemon; needs a client and a lifecycle the harness
#                         has no way to drive yet
#   write                 physical media; needs --device-allowlist (which does
#                         not exist) and a dedicated throwaway device
#
# `shrink` is here only in its real form: it takes a CHD output, so the
# "shrink an .img" shape that looks obvious is a usage error, not a test.

[meta]
tier = 3
group = "subcommands"
description = "Everything else rb-cli can be told to do, that a script can drive."

# --- new floppy: every fixed-geometry filesystem ------------------------------
# `new volume` was well covered; `new floppy` was not. Each must format, then
# inspect as the right type, then fsck.

[[case]]
id = "floppy.new.fat"
[[case.step]]
args = ["new", "floppy", "fat", "--size", "1440K", "{scratch}/f.img"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/f.img"]
expect_exit = 0
stdout_contains = ["FAT"]

[[case]]
id = "floppy.new.hfs"
[[case.step]]
args = ["new", "floppy", "hfs", "{scratch}/f.img"]
expect_exit = 0
[[case.step]]
