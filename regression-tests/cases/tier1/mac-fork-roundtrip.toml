id = "mac.fork-roundtrip.import.macbinary"
description = "import of a MacBinary extract keeps the fork"
[[case.step]]
args = ["archive", "create", "{scratch}/app.sit", "{cases}/tier1/forked-file"]
expect_exit = 0
[[case.step]]
args = [
    "archive",
    "extract",
    "{scratch}/app.sit",
    "{scratch}/out",
    "--format",
    "macbinary",
]
expect_exit = 0
[[case.step]]
args = ["new", "volume", "hfs", "--size", "4M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["import", "{scratch}/v.img", "{scratch}/out"]
expect_exit = 0
[[case.step]]
args = ["du", "{scratch}/v.img", "--format", "json"]
expect_exit = 0
expect_envelope_ok = true
[[case.step.json_equals]]
path = "paths.0.data_bytes"
value = 32
[[case.step.json_equals]]
path = "paths.0.rsrc_bytes"
value = 64

[[case]]
id = "mac.fork-roundtrip.import.appledouble"
description = "import of an AppleDouble extract keeps the fork (the sidecar must be consumed, not deleted)"
[[case.step]]
args = ["archive", "create", "{scratch}/app.sit", "{cases}/tier1/forked-file"]
expect_exit = 0
[[case.step]]
args = [
    "archive",
    "extract",
    "{scratch}/app.sit",
    "{scratch}/out",
    "--format",
    "appledouble",
]
expect_exit = 0
files_exist = ["{scratch}/out/._forked-file"]
[[case.step]]
args = ["new", "volume", "hfs", "--size", "4M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["import", "{scratch}/v.img", "{scratch}/out"]
expect_exit = 0
[[case.step]]
args = ["du", "{scratch}/v.img", "--format", "json"]
expect_exit = 0
expect_envelope_ok = true
[[case.step.json_equals]]
path = "paths.0.data_bytes"
value = 32
[[case.step.json_equals]]
path = "paths.0.rsrc_bytes"
value = 64
# One file, not a data fork plus an orphaned sidecar.
[[case.step.json_equals]]
path = "paths.0.files"
value = 1

