# --- Known finding R-006 -----------------------------------------------------
# The default volume name is `rusty-backup`, which ProDOS rejects because of
# the hyphen, so `new volume prodos` always fails on defaults. Both cases are
# kept: the first asserts the default *should* work, the second proves the
# builder itself is sound when given a legal name. When R-006 is fixed the
# first case goes green on its own.

[[case]]
id = "fs.new-volume.prodos-default-name"
description = "R-006: prodos should format with the default volume name"
[[case.step]]
args = ["new", "volume", "prodos", "--size", "2M", "{scratch}/v.img"]
expect_exit = 0

[[case]]
id = "fs.new-volume.prodos-legal-name"
description = "prodos formats, inspects and fscks clean given a ProDOS-legal name"
[[case.step]]
args = ["new", "volume", "prodos", "--size", "2M", "--name", "TESTVOL", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/v.img", "--format", "json"]
expect_exit = 0
expect_envelope_ok = true
[[case.step.json_equals]]
path = "partitions.0.type_name"
value = "ProDOS"
[[case.step]]
args = ["fsck", "{scratch}/v.img", "--checkonly"]
expect_exit = 0
