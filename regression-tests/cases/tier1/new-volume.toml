# Tier 1 — self-fixturing.
#
# `rb-cli new volume` builds its own input, so this whole file runs on a bare
# machine with an empty fixture corpus. Every filesystem that gains a builder
# here retires a fixture we would otherwise have to host and copy around, so
# this is the highest-leverage tier in the suite (see README.md § Tier model).
#
# The shape is the same for each filesystem:
#   1. format a minimal volume
#   2. inspect it and assert the engine recognises what it just wrote
#   3. fsck --checkonly must come back clean on a freshly formatted volume
#
# Step 3 is the one that earns its keep: a formatter that emits a subtly
# invalid volume is exactly the class of bug that survives unit tests.
#
# Sizes were probed empirically on 2026-08-01: every filesystem here formats
# at 2 MB except ext3/ext4, which need 8 MB. Minimum sizes are deliberate —
# the corpus has to be copyable to a laptop and eventually a PowerPC machine.

[meta]
tier = 1
group = "fs.new-volume"
description = "Format a minimal volume per filesystem, then inspect and fsck it."

# --- Mac ---------------------------------------------------------------------

[[case]]
id = "fs.new-volume.hfs"
description = "classic HFS superfloppy formats, inspects and fscks clean"
[[case.step]]
args = ["new", "volume", "hfs", "--size", "2M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/v.img", "--format", "json"]
expect_exit = 0
expect_envelope_ok = true
json_exists = ["partitions.0.type_name"]
[[case.step]]
args = ["fsck", "{scratch}/v.img", "--checkonly"]
expect_exit = 0

