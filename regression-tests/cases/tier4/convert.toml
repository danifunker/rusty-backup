# Tier 4 — the conversion matrix.
#
# PLAN.md § Phase 5. These three were authored into tier 3 as part of the
# subcommand sweep and are re-tiered here rather than rewritten, so their IDs
# keep their history; the `subcmd.` prefix is the scar.
#
# The matrix is still thin: `produce` builds 53 artifacts and only three of
# them have a convert-then-reopen case. Widening it is the next increment for
# this tier — see GAPS.md.

[meta]
tier = 4
group = "convert"
description = "Re-encode into every container format and prove we can still open the result."

# --- inspect on everything produce can build -----------------------------------
# Cheap breadth: every container `convert` writes must be re-openable by us.
# This is deliberately tier-1-grade evidence (rb-cli reading its own output),
# but it is the difference between "we wrote a file" and "we wrote a file we
# can still open".

[[case]]
id = "subcmd.convert.qcow2-reopens"
[[case.step]]
args = ["new", "volume", "fat", "--size", "2M", "{scratch}/src.img"]
expect_exit = 0
[[case.step]]
args = ["convert", "{scratch}/src.img", "{scratch}/out", "--format", "qcow2"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/out/src.qcow2"]
expect_exit = 0
stdout_contains = ["FAT"]

[[case]]
id = "subcmd.convert.vmdk-sparse-reopens"
[[case.step]]
args = ["new", "volume", "fat", "--size", "2M", "{scratch}/src.img"]
expect_exit = 0
[[case.step]]
args = ["convert", "{scratch}/src.img", "{scratch}/out", "--format", "vmdk-sparse"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/out/src.vmdk"]
expect_exit = 0
stdout_contains = ["FAT"]

[[case]]
id = "subcmd.convert.chd-reopens"
[[case.step]]
args = ["new", "volume", "fat", "--size", "2M", "{scratch}/src.img"]
expect_exit = 0
[[case.step]]
args = ["convert", "{scratch}/src.img", "{scratch}/out", "--format", "chd"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/out/src.chd"]
expect_exit = 0
stdout_contains = ["FAT"]
