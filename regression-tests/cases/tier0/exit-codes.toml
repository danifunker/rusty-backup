# Tier 0 — the exit-code contract from src/cli/exit.rs.
#
#   0  SUCCESS
#   1  GENERIC_FAILURE
#   2  USAGE_ERROR
#   3  NOT_FOUND
#   4  PERMISSION_DENIED
#   5  USER_DECLINED
# 130  SIGINT
#
# These cases assert the *documented* contract, not the observed behaviour.
# Where the two disagree the case fails, which is exactly what the suite is
# for. Known disagreements are written up in COVERAGE.md § Findings; do not
# "fix" a case here to match a bug.

[meta]
tier = 0
group = "cli.exit-codes"
description = "Exit codes match the contract in src/cli/exit.rs."

[[case]]
id = "cli.exit.unknown-verb-is-usage-error"
description = "an unrecognised subcommand exits 2 (USAGE_ERROR)"
args = ["definitely-not-a-verb"]
expect_exit = 2

[[case]]
id = "cli.exit.missing-required-arg-is-usage-error"
description = "a verb invoked without its required arguments exits 2"
args = ["get"]
expect_exit = 2

[[case]]
id = "cli.exit.unknown-flag-is-usage-error"
description = "an unrecognised flag on a real verb exits 2"
args = ["inspect", "--no-such-flag"]
expect_exit = 2

# --- Known finding R-004 -----------------------------------------------------
# src/cli/output.rs documents that a nested-result verb asked for csv/tsv
# "errors out with crate::cli::exit::USAGE_ERROR" (2). It currently exits 1
# because require_non_flat uses anyhow::bail!. Asserting the documented
# contract so the finding stays visible every run until it is fixed.
[[case]]
id = "cli.exit.csv-on-nested-verb-is-usage-error"
description = "R-004: --format csv on inspect should exit 2 per output.rs"
[[case.step]]
args = ["new", "volume", "fat", "--size", "2M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/v.img", "--format", "csv"]
expect_exit = 2

[[case]]
id = "cli.exit.tsv-on-nested-verb-is-usage-error"
description = "R-004: --format tsv on inspect should exit 2 per output.rs"
[[case.step]]
args = ["new", "volume", "fat", "--size", "2M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/v.img", "--format", "tsv"]
expect_exit = 2

# --- Missing host file -------------------------------------------------------
# Deliberately asserted as GENERIC_FAILURE (1), which is what the engine does
# today. NOT_FOUND (3) would arguably be the better code for "the image file
# is not there", but the contract does not currently claim it, so this case
# documents present behaviour rather than inventing a requirement.
[[case]]
id = "cli.exit.missing-image-file"
description = """inspect on a nonexistent image exits 3. exit.rs reserves
NOT_FOUND for exactly this ("image file missing"), and cli.flags.inspect-accepts-fs-type
depends on it to tell "the flag parsed and the file was absent" from "the flag
was rejected". This case asserted 1 until 2026-08-08, describing itself as
"current documented-free behaviour" — it pinned the status quo rather than the
contract, and the two cases contradicted each other once R-010 was fixed."""
args = ["inspect", "{scratch}/does-not-exist.img"]
expect_exit = 3

# --- R-036: one condition, three exit codes ----------------------------------
# `exit.rs` reserves NOT_FOUND (3) for "image file missing" — its own first
# example. R-010 made `inspect` obey it (cli.exit.missing-image-file, green).
# Nothing else does: most verbs exit 1 with a raw platform-specific io::Error,
# and `locate` / `tar` exit 2, which claims the *command* was malformed when it
# was well-formed and named a file that is not there.
#
# One case per verb, because each is a separate contract a script switches on.
# All red until R-036 is fixed.

[[case]]
id = "cli.exit.ls-missing-image-is-not-found"
description = "R-036: ls on a nonexistent image should exit 3, not 1"
args = ["ls", "{scratch}/does-not-exist.img"]
expect_exit = 3

[[case]]
id = "cli.exit.du-missing-image-is-not-found"
description = "R-036: du on a nonexistent image should exit 3, not 1"
args = ["du", "{scratch}/does-not-exist.img"]
expect_exit = 3

[[case]]
id = "cli.exit.fsck-missing-image-is-not-found"
description = "R-036: fsck on a nonexistent image should exit 3, not 1"
args = ["fsck", "{scratch}/does-not-exist.img", "--checkonly"]
expect_exit = 3

[[case]]
id = "cli.exit.show-fs-info-missing-image-is-not-found"
description = "R-036: show fs-info on a nonexistent image should exit 3, not 1"
args = ["show", "fs-info", "{scratch}/does-not-exist.img"]
expect_exit = 3

[[case]]
id = "cli.exit.locate-missing-image-is-not-found"
description = "R-036: locate on a nonexistent image exits 3, not 1"
args = ["locate", "{scratch}/does-not-exist.img", "/anything"]
expect_exit = 3

[[case]]
id = "cli.exit.tar-missing-image-is-not-found"
description = """R-036: tar on a nonexistent image exits 3.

First written with two positionals, which made clap reject it as a usage error
before the image was ever opened — the case asserted 3 and got a correct 2 for
the wrong reason. `tar` takes IMAGE, SRC and OUT. Corrected deliberately, and
the finding's table corrected with it: `tar` was never a real 2, it was a
malformed command in the survey."""
args = ["tar", "{scratch}/does-not-exist.img", "/", "{scratch}/out.tar"]
expect_exit = 3
