# Tier 0 — flags the CLI contract says exist.
#
# These assert the **intended** behaviour, so they are red until the finding
# they pin is fixed and green afterwards. That is the point: a failing case is
# the tracking mechanism, and the same case then guards against the bug
# coming back. Do not "fix" one of these by asserting the broken behaviour.

[meta]
tier = 0
group = "cli.flags"
description = "Flags documented or implied by the CLI contract, per finding."

# --- R-010 ------------------------------------------------------------------

[[case]]
id = "cli.flags.inspect-accepts-fs-type"
description = "R-010: --fs-type exists on ls/fsck/du but not inspect, so signature-less formats (all nine CP/M DPBs) cannot be inspected at all"
# Needs no fixture: the flag is rejected during argument parsing, before the
# image is ever opened, so a non-existent path still proves the point.
[[case.step]]
args = ["inspect", "no-such-image.dsk", "--fs-type", "cpm:amstrad_data"]
# Exit 3 = NOT_FOUND would mean the flag parsed and the file was missing,
# which is what we want. Exit 2 = USAGE_ERROR means the flag itself was
# rejected — the bug.
expect_exit = 3

[[case]]
id = "cli.flags.ls-accepts-fs-type"
description = "The working half of R-010 — ls does take --fs-type. Guards the path CP/M currently depends on."
fixture = "fs.cpc.amsdos.floppy"
[[case.step]]
args = ["ls", "{fixture}", "--fs-type", "cpm:amstrad_data"]
expect_exit = 0
stdout_contains = ["MANIC.BAS", "MANIC.BIN"]

# --- inspect verification flags ----------------------------------------------
# `inspect` opens anything — that is the point of a universal tool, and a disk
# with no recognisable filesystem still yields a carve view. The cost is that a
# clean exit means "readable", not "identified", which is how a fixture with no
# filesystem at all was admitted on the strength of "inspect opens it" (R-031).
# These flags let a caller ask the stronger question.

[[case]]
id = "cli.flags.inspect-expect-fs-matches"
description = "--expect-fs succeeds when the filesystem is the one named"
[[case.step]]
args = ["new", "floppy", "apple-dos", "--size", "140K", "{scratch}/d.dsk"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/d.dsk", "--expect-fs", "DOS 3.3"]
expect_exit = 0
# Case, spacing and punctuation are normalised away before comparing.
[[case.step]]
args = ["inspect", "{scratch}/d.dsk", "--expect-fs", "dos3.3"]
expect_exit = 0

[[case]]
id = "cli.flags.inspect-expect-fs-rejects-a-mismatch"
description = "--expect-fs fails when the disk carries something else, and says what it found"
[[case.step]]
args = ["new", "floppy", "apple-dos", "--size", "140K", "{scratch}/d.dsk"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/d.dsk", "--expect-fs", "FAT"]
expect_exit = 1
stderr_contains = ["Found: DOS 3.3"]

[[case]]
id = "cli.flags.inspect-expect-fs-is-not-a-substring-match"
description = """FAT must not satisfy exFAT. The comparison normalises case and
punctuation, then compares exactly — a substring rule would make the flag worse
than useless on the FAT family."""
[[case.step]]
args = ["new", "volume", "fat", "--size", "2M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/v.img", "--expect-fs", "exFAT"]
expect_exit = 1

[[case]]
id = "cli.flags.inspect-require-known-passes-on-a-real-volume"
description = "--require-known is satisfied when every partition was identified"
[[case.step]]
args = ["new", "volume", "fat", "--size", "2M", "{scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/v.img", "--require-known"]
expect_exit = 0

[[case]]
id = "cli.flags.inspect-still-opens-what-it-cannot-identify"
description = """Universality is the default: with no assertion flag, a disk
carrying no recognisable filesystem still opens and still exits 0. The flags are
opt-in precisely so this stays true."""
[[case.step]]
args = ["new", "volume", "fat", "--size", "2M", "{scratch}/v.img"]
expect_exit = 0
# Wipe the boot sector: still a readable disk, no longer an identifiable FS.
[[case.step]]
args = ["put", "{scratch}/v.img", "--zero", "1024", "--dst", "/x"]
expect_exit = 0

[[case]]
id = "cli.flags.inspect-expect-layout-superfloppy"
description = "--expect-layout tells a bare volume from a partitioned disk"
[[case.step]]
args = ["new", "volume", "fat", "--size", "2M", "{scratch}/sf.img"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/sf.img", "--expect-layout", "superfloppy"]
expect_exit = 0
# The scheme name for "no table" works too, for callers who think in schemes.
[[case.step]]
args = ["inspect", "{scratch}/sf.img", "--expect-layout", "none"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/sf.img", "--expect-layout", "partitioned"]
expect_exit = 1
stderr_contains = ["this disk is None"]

[[case]]
id = "cli.flags.inspect-expect-layout-partitioned"
description = "--expect-layout matches a scheme by name, and rejects the wrong scheme"
[[case.step]]
args = ["new", "hd", "x68k", "--size", "16M", "{scratch}/hd.img"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/hd.img", "--expect-layout", "partitioned"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/hd.img", "--expect-layout", "x68k"]
expect_exit = 0
# A different scheme must not satisfy it — that is the whole point.
[[case.step]]
args = ["inspect", "{scratch}/hd.img", "--expect-layout", "mbr"]
expect_exit = 1
[[case.step]]
args = ["inspect", "{scratch}/hd.img", "--expect-layout", "superfloppy"]
expect_exit = 1

[[case]]
id = "cli.flags.inspect-expect-layout-typo-is-a-usage-error"
description = """A word that names no layout exits 2, not 1. Otherwise a typo
reads as "the disk is the wrong shape", which is the most misleading answer
available — the script would blame the disk."""
[[case.step]]
args = ["new", "volume", "fat", "--size", "2M", "{scratch}/sf.img"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/sf.img", "--expect-layout", "mbrr"]
expect_exit = 2
stderr_contains = ["is not a layout", "superfloppy"]
