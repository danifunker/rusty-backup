[[case]]
id = "tour.appkit.optical"
description = "Optical on the ISO fixture: the disc, its browser, Convert on it, and Archives on the StuffIt file it holds"
level = "smoke"
area = ["optical", "archives", "convert"]
shells = ["appkit"]
fixture = "optical.iso9660.joliet.cd"
capabilities = []
timeout_ms = 300000

[[case.step]]
args = ["optical", "extract", "{fixture}", "--to", "{scratch}/iso"]
