level = "smoke"
area = ["inspect"]
shells = ["appkit"]
capabilities = []
timeout_ms = 300000

[[case.step]]
ui = [
  { tab = "Build Disk" },
  { activate = "build_disk.next" },
  { pick = "{scratch}/mbr.img" },
  { activate = "build_disk.pick_image" },
  { activate = "build_disk.next" },
  { focus = "build_disk.size" },
  { fill = "32M" },
  { activate = "build_disk.next" },
  { focus = "build_disk.row_content.0" },
  { choose = "FAT12" },
  { activate = "build_disk.next" },
  { activate = "build_disk.next" },
  { activate = "build_disk.create" },
  { wait = "build_disk.open_inspect", timeout_ms = 240000 },
  { activate = "build_disk.open_inspect" },
  { wait = "Re-inspect" },
  { shot = "inspect-loaded" },
  { activate = "inspect.row.check" },
  { wait = "Close", timeout_ms = 60000 },
  { shot = "inspect-check" },
  { activate = "inspect.check.close" },
  { activate = "inspect.expand_image" },
  { wait = "Add free space" },
  { focus = "inspect.expand_image.add_mib" },
  { fill = "16" },
  { wait = "New size: 48" },
  { shot = "inspect-expand-image" },
  { activate = "inspect.expand_image.start" },
  { activate = "inspect.reinspect" },
  { wait = "48.0 MiB" },
  { activate = "inspect.resize" },
  { wait = "Partition Sizes:" },
  { shot = "inspect-resize" },
  { activate = "resize.close" },
  { activate = "inspect.add_partition" },
  { wait = "Will be added as partition" },
  { shot = "inspect-table-editor" },
  { activate = "partition_edit.cancel" },
  { activate = "inspect.export" },
  { wait = "Partition Sizes:" },
  { shot = "inspect-export" },
  { activate = "inspect.export.close" },
  { activate = "inspect.row.browse" },
  { wait = "Filesystem Browser" },
  { shot = "browse-readonly" },
  { activate = "browse.edit_mode" },
  { wait = "Edit Mode ON" },
  { shot = "browse-edit-mode" },
]

[[case]]
id = "tour.appkit.hfs"
description = "Expand HFS Volume on a classic HFS floppy"
level = "smoke"
area = ["inspect"]
shells = ["appkit"]
capabilities = []
timeout_ms = 120000

[[case.step]]
args = ["new", "floppy", "hfs", "--size", "1440K", "{scratch}/h.img"]
expect_exit = 0

[[case.step]]
ui = [
  { tab = "Inspect" },
  { pick = "{scratch}/h.img" },
  { activate = "inspect.source.open_file" },
  { wait = "HFS" },
  { activate = "inspect.row.expand_hfs" },
  { wait = "Expand HFS Volume" },
  { shot = "inspect-expand-hfs" },
]

[[case]]
id = "tour.appkit.backup-restore"
description = "Backup with an image loaded and its VHD window; Restore with a backup folder, Write Image File and the disk writer"
level = "smoke"
area = ["backup", "restore"]
shells = ["appkit"]
capabilities = []
timeout_ms = 240000

[[case.step]]
args = ["new", "floppy", "fat", "--size", "1440K", "{scratch}/src.img"]
expect_exit = 0

[[case.step]]
args = ["put", "{scratch}/src.img", "{cases}/tier8/data/hello.txt", "/HELLO.TXT"]
expect_exit = 0

[[case.step]]
args = ["backup", "{scratch}/src.img", "{scratch}/bk", "--name", "job", "--format", "zstd"]
expect_exit = 0

[[case.step]]
ui = [
  { tab = "Backup" },
  { pick = "{scratch}/src.img" },
  { activate = "backup.open_image" },
  { wait = "FAT" },
  { focus = "backup.destination" },
  { fill = "{scratch}" },
  { focus = "backup.name" },
  { fill = "tour" },
  { shot = "backup-loaded" },
  { focus = "backup.format" },
  { choose = "VHD" },
  { activate = "backup.start" },
  { wait = "VHD Backup Options" },
  { shot = "backup-vhd" },
  { activate = "backup.vhd_cancel" },
  { tab = "Restore" },
  { pick = "{scratch}/bk/job" },
  { activate = "restore.backup_folder" },
  { wait = "1 partition" },
  { shot = "restore-loaded" },
  { focus = "restore.target_kind" },
  { choose = "Save as image file" },
  { shot = "restore-to-image" },
  { focus = "restore.mode" },
  { choose = "Write Image File" },
  { pick = "{scratch}/src.img" },
  { activate = "restore.write_image" },
  { wait = "Decoded size" },
  { shot = "restore-write-image" },
  { activate = "restore.write_target" },
  { wait = "Physical Disk Export" },
  { shot = "disk-writer" },
]

