# Tier 9: the AppKit screenshot tour (FLOWS.md). Not a test of behaviour: each case walks screens
# and dialogs with real content and shoots the app's own windows (`shot`), for
# scripts/appkit-tour.sh to lay out side by side in light and dark. A shot named `a-b` is screen
# `a`, state `b`; a second window open at the same time is saved as `a-b-2`.

[meta]
tier = 9
group = "tour.appkit"
description = "Shoot every AppKit screen and dialog for a visual review."

[[case]]
id = "tour.appkit.screens"
description = "Every screen with nothing open, Commander, Settings and the remote windows"
level = "smoke"
area = ["shell"]
shells = ["appkit"]
capabilities = []
timeout_ms = 180000

[[case.step]]
ui = [
  { tab = "Backup" },
  { shot = "backup-empty" },
  { tab = "Restore" },
  { shot = "restore-empty" },
  { tab = "Build Disk" },
  { shot = "build-kind" },
  { tab = "Inspect" },
  { shot = "inspect-empty" },
  { tab = "Convert" },
  { shot = "convert-empty" },
  { tab = "Optical" },
  { shot = "optical-empty" },
  { activate = "optical.source_drive" },
  { shot = "optical-drive" },
  { activate = "optical.add_remote" },
  { wait = "Daemon address" },
  { shot = "optical-add-remote" },
  { activate = "optical.remote_cancel" },
  { wait_gone = "Daemon address" },
  { tab = "Archives" },
  { shot = "archives-empty" },
  { tab = "Backup" },
  { activate = "backup.remote_open" },
  { wait = "Remote Drive" },
  { shot = "backup-remote-drive" },
  { activate = "backup.remote_close" },
  { activate = "app.settings" },
  { wait = "Update Check" },
  { shot = "settings" },
  { activate = "settings.cancel" },
  { wait_gone = "Update Check" },
  { tab = "Inspect" },
  { activate = "inspect.source.connect_remote" },
  { wait = "Connect to remote" },
  { shot = "inspect-connect-prompt" },
  { activate = "prompt.cancel" },
  { activate = "app.commander" },
  { wait = "Commander" },
  { shot = "commander-empty" },
]

[[case]]
