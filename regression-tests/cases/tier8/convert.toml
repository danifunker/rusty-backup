# Tier 8: the Convert tab, end to end through a front-end (FLOWS.md).

[meta]
tier = 8
group = "flow.convert"
description = "Convert images on the Convert tab (a disc to CHD, floppies between containers), then prove the output with rb-cli."

[[case]]
id = "flow.convert.iso-to-chd"
description = "Convert the ISO fixture to a CD CHD on the Convert tab, then extract a file from the CHD and compare it with the same file from the ISO"
level = "smoke"
area = ["convert", "optical"]
shells = ["gtk", "win32", "appkit"]
fixture = "optical.iso9660.joliet.cd"
capabilities = ["convert.disc", "optical.chd"]
timeout_ms = 300000

[[case.step]]
ui = [
  { tab = "Convert" },
  { pick = "{fixture}" },
  { activate = "convert.source_file" },
  { wait = "will be converted", timeout_ms = 60000 },
  { focus = "convert.disc.format" },
  { choose = "CD CHD" },
  { pick = "{scratch}/disc.chd" },
  { activate = "convert.output" },
  { wait = "disc.chd" },
  { activate = "convert.start" },
  { wait = "Converted 1 file", timeout_ms = 240000 },
]

[[case.step]]
args = ["optical", "extract", "{scratch}/disc.chd", "--to", "{scratch}/chd"]
expect_exit = 0

[[case.step]]
args = ["optical", "extract", "{fixture}", "--to", "{scratch}/iso"]
expect_exit = 0
files_identical = [["{scratch}/iso/CIV_II_GOLD_111_UPDATE.SIT", "{scratch}/chd/CIV_II_GOLD_111_UPDATE.SIT"]]

[[case]]
id = "flow.convert.floppy-dc42"
description = "Convert an 800 KB HFS floppy to DiskCopy 4.2 on the Convert tab, then read its file back out of the .dsk"
level = "full"
area = ["convert", "floppy"]
shells = ["gtk", "win32", "appkit"]
capabilities = ["convert.floppy"]
timeout_ms = 180000

[[case.step]]
args = ["new", "floppy", "hfs", "--size", "800K", "{scratch}/f.img"]
expect_exit = 0

[[case.step]]
args = ["put", "{scratch}/f.img", "{cases}/tier8/data/hello.txt", "/HELLO.TXT"]
expect_exit = 0

# The Mac's own floppy image format, its tag bytes and checksum written by the converter.
[[case.step]]
ui = [
  { tab = "Convert" },
  { pick = "{scratch}/f.img" },
  { activate = "convert.source_file" },
  { wait = "will be converted", timeout_ms = 60000 },
  { focus = "convert.floppy.format" },
  { choose = "DiskCopy" },
  { pick = "{scratch}/f.dsk" },
  { activate = "convert.output" },
  { wait = "f.dsk" },
  { activate = "convert.start" },
  { wait = "Converted 1 file", timeout_ms = 120000 },
]

# The file comes back out of the converted container byte for byte.
[[case.step]]
args = ["get", "{scratch}/f.dsk", "/HELLO.TXT", "{scratch}/back.txt"]
expect_exit = 0
files_identical = [["{cases}/tier8/data/hello.txt", "{scratch}/back.txt"]]

