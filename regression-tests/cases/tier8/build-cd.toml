# Tier 8: building CD-ROM images on the Build Disk screen, end to end (FLOWS.md).

[meta]
tier = 8
group = "flow.build.cd"
description = "Build a CD-ROM image from a host folder, then prove it with rb-cli."

[[case]]
id = "flow.build.efs-cd"
description = "Build an IRIX EFS CD-ROM image filled from a host folder on the Build Disk screen, then read the file back from it with rb-cli"
level = "smoke"
area = ["build-disk", "optical"]
shells = ["tui", "gtk"]
capabilities = ["build.cd-efs", "build.cd-from-folder"]
timeout_ms = 300000

[[case.step]]
ui = [
  { tab = "Build Disk" },
  { focus = "build.kind" },
  { choose = "CD-ROM image" },
  { activate = "build.next" },
  { pick = "{scratch}/efs.iso" },
  { activate = "build.save_as" },
  { activate = "build.next" },
  { focus = "build.cd_layout" },
  { choose = "IRIX EFS" },
  { focus = "build.cd_size" },
  { choose = "sized to the folder", only = "tui" },
  { choose = "on", only = "gtk" },
  { pick = "{cases}/tier8/data/inject" },
  { activate = "build.cd_fill_from" },
  { wait = "inject" },
  { activate = "build.next" },
  { wait = "IRIX EFS CD-ROM" },
  { activate = "build.create" },
  { wait = "build.done", timeout_ms = 240000 },
]

[[case.step]]
args = ["ls", "{scratch}/efs.iso", "/"]
expect_exit = 0
stdout_contains = ["HELLO.TXT"]

[[case.step]]
args = ["get", "{scratch}/efs.iso", "/HELLO.TXT", "{scratch}/back.txt"]
expect_exit = 0
files_identical = [["{cases}/tier8/data/hello.txt", "{scratch}/back.txt"]]
