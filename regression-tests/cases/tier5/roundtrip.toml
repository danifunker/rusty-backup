# Tier 5 — backup -> restore -> compare.
#
# The product's headline feature, and until now it had no test: `restore`
# appeared exactly once in the whole suite, as `restore --help`. See
# COMMAND-COVERAGE.md.
#
# The shape every case here uses:
#
#   1. new volume <fs>              build a source
#   2. backup --name job            back it up (--name, or the folder is
#                                   timestamped and the restore path is
#                                   unpredictable)
#   3. restore <bk>/job <out>       restore to a new file
#   4. files_identical              compare - the whole point
#
# `--sector-by-sector` is what makes step 4 meaningful: it asks for a faithful
# image rather than a compacted one, so anything but byte-equality is a defect.
# The compaction paths get their own cases below, where equality is NOT the
# expectation and the assertion is that the volume still fscks clean.

[meta]
tier = 5
group = "roundtrip"
description = "Back up a volume, restore it, and prove the bytes survived."

# --- sector-by-sector must be byte-exact -------------------------------------

[[case]]
id = "roundtrip.fat.raw"
description = "FAT: backup -> restore -> byte-identical"
[[case.step]]
args = ["new", "volume", "fat", "--size", "2M", "{scratch}/src.img"]
expect_exit = 0
[[case.step]]
args = ["backup", "{scratch}/src.img", "{scratch}/bk", "--name", "job", "--format", "raw", "--sector-by-sector"]
expect_exit = 0
[[case.step]]
args = ["restore", "{scratch}/bk/job", "{scratch}/out.img"]
expect_exit = 0
files_identical = [["{scratch}/src.img", "{scratch}/out.img"]]

