# --- output-format matrix ----------------------------------------------------
# Same round-trip, different backup containers. A format that cannot restore
# what it stored is worse than one that cannot store at all, because the loss
# is only discovered when the backup is needed.

[[case]]
id = "roundtrip.format.zstd"
description = "zstd-compressed backup must restore byte-identical"
[[case.step]]
args = ["new", "volume", "fat", "--size", "2M", "{scratch}/src.img"]
expect_exit = 0
[[case.step]]
args = ["backup", "{scratch}/src.img", "{scratch}/bk", "--name", "job", "--format", "zstd", "--sector-by-sector"]
expect_exit = 0
[[case.step]]
args = ["restore", "{scratch}/bk/job", "{scratch}/out.img"]
expect_exit = 0
files_identical = [["{scratch}/src.img", "{scratch}/out.img"]]

