# --- checksums ---------------------------------------------------------------
# The metadata records a checksum per file. Restoring is the only thing that
# proves the recorded value was ever right.

[[case]]
id = "roundtrip.checksum.sha256"
[[case.step]]
args = ["new", "volume", "fat", "--size", "2M", "{scratch}/src.img"]
expect_exit = 0
[[case.step]]
args = ["backup", "{scratch}/src.img", "{scratch}/bk", "--name", "job", "--format", "raw", "--sector-by-sector", "--checksum", "sha256"]
expect_exit = 0
[[case.step]]
args = ["restore", "{scratch}/bk/job", "{scratch}/out.img"]
expect_exit = 0
files_identical = [["{scratch}/src.img", "{scratch}/out.img"]]

