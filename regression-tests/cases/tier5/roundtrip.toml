expect_exit = 0
[[case.step]]
args = ["backup", "{scratch}/src.img", "{scratch}/bk", "--name", "job", "--format", "raw", "--sector-by-sector", "--checksum", "crc32"]
expect_exit = 0
[[case.step]]
args = ["restore", "{scratch}/bk/job", "{scratch}/out.img"]
expect_exit = 0
files_identical = [["{scratch}/src.img", "{scratch}/out.img"]]

# --- compacted backup --------------------------------------------------------
# Without --sector-by-sector the backup may compact, so byte-equality is NOT
# expected. What must hold is that the restored volume is still a valid
# filesystem — the thing a user actually needs back.

[[case]]
id = "roundtrip.compacted.fat-still-fscks"
description = "A compacted backup need not be byte-identical, but must restore to a sound volume"
[[case.step]]
args = ["new", "volume", "fat", "--size", "4M", "{scratch}/src.img"]
expect_exit = 0
[[case.step]]
args = ["backup", "{scratch}/src.img", "{scratch}/bk", "--name", "job", "--format", "raw"]
expect_exit = 0
[[case.step]]
args = ["restore", "{scratch}/bk/job", "{scratch}/out.img"]
expect_exit = 0
files_exist = ["{scratch}/out.img"]
[[case.step]]
args = ["fsck", "{scratch}/out.img", "--checkonly"]
expect_exit = 0

# --- data survival -----------------------------------------------------------
# The assertion users care about most: a file written before the backup is
# readable after the restore, with the same bytes.

[[case]]
id = "roundtrip.data-survives"
description = "A file put into the volume must come back out of the restored copy unchanged"
[[case.step]]
args = ["new", "volume", "fat", "--size", "4M", "{scratch}/src.img"]
expect_exit = 0
[[case.step]]
args = ["put", "{scratch}/src.img", "{cases}/tier3/payload.bin", "/payload.bin"]
expect_exit = 0
[[case.step]]
args = ["backup", "{scratch}/src.img", "{scratch}/bk", "--name", "job", "--format", "raw", "--sector-by-sector"]
expect_exit = 0
[[case.step]]
args = ["restore", "{scratch}/bk/job", "{scratch}/out.img"]
expect_exit = 0
[[case.step]]
args = ["get", "{scratch}/out.img", "/payload.bin", "{scratch}/payload.out"]
expect_exit = 0
files_identical = [["{cases}/tier3/payload.bin", "{scratch}/payload.out"]]
