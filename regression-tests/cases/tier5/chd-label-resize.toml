# Tier 5 — resize a disk-label backup on restore.
#
# The label schemes (Sun, NeXT, SGI volume header, SGI disk label, Amiga RDB,
# Atari AHDI, Sharp X68k) are backed up whole: the head region rides verbatim
# in the single-file CHD. A resize is applied on restore, where
# `partition::restore_patch` rewrites the label's start/size fields and
# checksums in those verbatim bytes and the bodies land wherever the label
# now says. Until 2026-09-11 a `--size minimum` restore of any of these
# exited 0 and corrupted the disk: the bodies moved and the label did not.
#
# Every case here shrinks the first partition to its minimum and checks three
# things: the label parses and no longer places the next partition where it
# was, the shrunk filesystem still lists its files, and fsck is clean.

[meta]
tier = 5
group = "chd.label-resize"
description = "Shrink the first partition of each disk-label scheme on restore; the label follows."

# --- FAT slices on the schemes that can hold one ---------------------------------

[[case]]
id = "chd.label-resize.sun-fat-slice"
description = "Sun label: slice 0 shrinks to a cylinder boundary and slice 1 slides down from LBA 67536."
[[case.step]]
args = ["new", "volume", "fat", "{scratch}/v.img", "--size", "32M"]
expect_exit = 0
[[case.step]]
args = ["put", "{scratch}/v.img", "{cases}/tier3/payload.bin", "/PAYLOAD.BIN"]
expect_exit = 0
[[case.step]]
args = ["new", "hd", "sun", "{scratch}/s.img", "--size", "64M", "--partition", "32M", "--partition", "rest", "--fill", "1={scratch}/v.img"]
expect_exit = 0
[[case.step]]
args = ["backup", "{scratch}/s.img", "{scratch}/bk", "--name", "job", "--format", "chd"]
expect_exit = 0
[[case.step]]
args = ["restore", "{scratch}/bk/job", "{scratch}/out.img", "--size", "minimum"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/out.img"]
expect_exit = 0
stdout_contains = ["Partition table: Sun", "1008"]
stdout_not_contains = ["67536", "32.5 MiB"]
[[case.step]]
args = ["ls", "{scratch}/out.img@1", "/"]
expect_exit = 0
stdout_contains = ["PAYLOAD.BIN"]
[[case.step]]
args = ["fsck", "{scratch}/out.img@1", "--checkonly"]
expect_exit = 0

