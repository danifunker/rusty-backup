[[case.step]]
args = ["ls", "{scratch}/out.img@1", "/"]
expect_exit = 0
stdout_contains = ["payload.bin"]
[[case.step]]
args = ["fsck", "{scratch}/out.img@1", "--checkonly"]
expect_exit = 0

# --- Amiga RDB, on a real Workbench disk --------------------------------------------

[[case]]
id = "chd.label-resize.rdb-workbench13"
description = "Amiga RDB: the RDSK and PART blocks are rewritten on cylinder boundaries and the FSHD/LSEG chain rides through untouched."
fixture = "fs.affs.workbench13.hd"
timeout_ms = 1200000
[[case.step]]
args = ["backup", "{fixture}", "{scratch}/bk", "--name", "job", "--format", "chd"]
expect_exit = 0
[[case.step]]
args = ["restore", "{scratch}/bk/job", "{scratch}/out.img", "--size", "minimum"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/out.img"]
expect_exit = 0
stdout_contains = ["Partition table: RDB"]
[[case.step]]
args = ["fsck", "{scratch}/out.img@1", "--checkonly"]
expect_exit = 0
stdout_contains = ["337 files"]

# --- Sharp X68000, now a single-file CHD ---------------------------------------------

[[case]]
id = "chd.label-resize.x68k-single-file"
description = "X68k: one whole-disk CHD, an as-is restore that carries the IPL back byte for byte, and a table rewrite on --size minimum."
[[case.step]]
args = ["new", "hd", "x68k", "{scratch}/x.img", "--size", "32M"]
expect_exit = 0
[[case.step]]
args = ["backup", "{scratch}/x.img", "{scratch}/bk", "--name", "job", "--format", "chd"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/bk/job/job.chd"]
expect_exit = 0
stdout_contains = ["Logical size: 33,554,432 bytes", "Partition table: X68k"]
[[case.step]]
args = ["restore", "{scratch}/bk/job", "{scratch}/asis.img"]
expect_exit = 0
files_identical = [["{scratch}/x.img", "{scratch}/asis.img"]]
[[case.step]]
args = ["restore", "{scratch}/bk/job", "{scratch}/min.img", "--size", "minimum"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/min.img"]
expect_exit = 0
stdout_contains = ["Partition table: X68k", "16.1 MiB"]
[[case.step]]
args = ["ls", "{scratch}/min.img@1", "/"]
expect_exit = 0
stdout_contains = ["HELLO.TXT"]
