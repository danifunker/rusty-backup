# --- the SGI schemes, on their own filesystems --------------------------------------

[[case]]
id = "chd.label-resize.sgi-efs-root"
description = "SGI volume header: the EFS root shrinks to its minimum and the header's slot follows."
[[case.step]]
args = ["new", "hd", "sgi-efs", "{scratch}/g.img", "--size", "64M"]
expect_exit = 0
[[case.step]]
args = ["put", "{scratch}/g.img@1", "{cases}/tier3/payload.bin", "/payload.bin"]
expect_exit = 0
[[case.step]]
args = ["backup", "{scratch}/g.img", "{scratch}/bk", "--name", "job", "--format", "chd"]
expect_exit = 0
[[case.step]]
args = ["restore", "{scratch}/bk/job", "{scratch}/out.img", "--size", "minimum"]
expect_exit = 0
[[case.step]]
args = ["inspect", "{scratch}/out.img"]
expect_exit = 0
stdout_contains = ["Partition table: SGI", "5040"]
stdout_not_contains = ["62.0 MiB"]
[[case.step]]
args = ["ls", "{scratch}/out.img@1", "/"]
expect_exit = 0
stdout_contains = ["payload.bin"]
[[case.step]]
