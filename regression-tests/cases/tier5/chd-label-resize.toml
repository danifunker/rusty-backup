expect_exit = 0

[[case]]
id = "chd.label-resize.sgi-dklabel-root"
description = "IRIS disk label: the EFS v1 root shrinks, swap slides down from block 34272, and the label keeps its word order."
[[case.step]]
args = ["new", "volume", "efs-v1", "{scratch}/e.img", "--size", "16M"]
expect_exit = 0
[[case.step]]
args = ["put", "{scratch}/e.img", "{cases}/tier3/payload.bin", "/payload.bin"]
expect_exit = 0
[[case.step]]
args = ["new", "hd", "sgi-dklabel", "{scratch}/d.img", "--size", "64M", "--partition", "16M:root", "--partition", "8M:swap", "--partition", "rest:slice", "--fill", "1={scratch}/e.img"]
expect_exit = 0
[[case.step]]
args = ["backup", "{scratch}/d.img", "{scratch}/bk", "--name", "job", "--format", "chd"]
expect_exit = 0
[[case.step]]
