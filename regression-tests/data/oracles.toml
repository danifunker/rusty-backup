# --- MiSTer CORE side --------------------------------------------------------
#
# The distinction that matters: the HPS is ARM Linux and its opinions are
# Linux opinions. The CORE is the vintage machine itself, running the real
# guest OS with its own filesystem code — Workbench's AFFS handler, Human68k's
# own driver. That is the authoritative reference, and it is the only thing
# about a MiSTer that a generic Linux box cannot also do.
#
# The HPS still matters, but as plumbing: it is how images get onto the SD
# card and how a guest-written result file gets read back off it.

[[oracle]]
id = "mister-core-amiga"
tool = "MiSTer Minimig core"
kind = "hardware"
notes = """Real AmigaOS reading the volume with its own filesystem handlers.
Unlike the HPS affs mount, this is the Amiga's opinion. Bootable Workbench
1.3 / 2.1 RDB+PFS disks are already on the board."""
availability = [{ platform = "mister-core", status = "expected" }]
verifies = [
  { format = "fs.affs", direction = "write", strength = "authoritative", status = "plausible" },
  { format = "fs.pfs3", direction = "write", strength = "authoritative", status = "plausible" },
  { format = "fs.sfs",  direction = "write", strength = "authoritative", status = "plausible", evidence = "needs the SFS handler installed in the guest" },
  { format = "part.rdb", direction = "write", strength = "authoritative", status = "plausible" },
]

