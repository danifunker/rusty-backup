# Oracle registry — source of truth for VERIFICATION-MATRIX.md.
#
# Hand-edited, diffable, reviewable. `rb-regress db build` loads this into
# SQLite; the markdown matrix is GENERATED from the database, never written
# by hand.
#
# status values for availability:
#   verified — actually run on that platform, with a date
#   expected — should be there, not yet confirmed
#   install  — exists but needs installing
#   absent   — confirmed not available
#
# strength values for what an oracle proves:
#   authoritative — the vendor's own tool (IRIX checking EFS)
#   structural    — a competent third party (qemu-img, fsck.vfat)
#   smoke         — opens without error, little more

[[oracle]]
id = "qemu-img"
tool = "qemu-img"
kind = "package"
availability = [
  { platform = "windows", status = "verified", path_hint = "C:/Program Files/qemu", verified_on = "2026-08-02" },
  { platform = "wsl",     status = "verified", path_hint = "/usr/bin/qemu-img",      verified_on = "2026-08-02" },
  { platform = "linux",   status = "expected" },
  { platform = "macos",   status = "install",  path_hint = "brew install qemu" },
]
verifies = [
  { format = "fmt.raw",         direction = "write", strength = "structural", status = "proven", evidence = "qemu-img info -> raw" },
  { format = "fmt.qcow2",       direction = "write", strength = "structural", status = "proven", evidence = "qemu-img check -> clean" },
  { format = "fmt.vhd-dynamic", direction = "write", strength = "structural", status = "proven", evidence = "qemu-img info -> vpc" },
  { format = "fmt.vhd-fixed",   direction = "write", strength = "smoke",      status = "proven", evidence = "qemu-img info -> raw; vpc prober scores below raw, unresolved" },
  { format = "fmt.vmdk-flat",   direction = "write", strength = "structural", status = "proven", evidence = "descriptor -> vmdk, extent -> raw" },
  { format = "fmt.vmdk-sparse", direction = "write", strength = "structural", status = "proven", evidence = "qemu-img check -> No errors were found" },
]

