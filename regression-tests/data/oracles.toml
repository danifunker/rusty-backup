# --- MiSTer CORE side --------------------------------------------------------
#
# The distinction that matters: the HPS is ARM Linux and its opinions are
# Linux opinions. The CORE is the vintage machine itself, running the real
# guest OS with its own filesystem code — Workbench's AFFS handler, Human68k's
# own driver. That is the authoritative reference, and it is the only thing
# about a MiSTer that a generic Linux box cannot also do.
#
# The HPS still matters, but as plumbing: it is how images get onto the SD
# card and how a guest-written result file gets read back off it.

