[[oracle]]
id = "fsck_hfs"
tool = "fsck_hfs"
kind = "package"
program = "oracles/fsck_hfs_image.sh"
notes = """macOS only. Nothing equivalent exists elsewhere, which is what makes a
Mac non-optional.

fsck_hfs will not read a plain file — "not a character device / Can't get
device block size" — so the oracle runs through oracles/fsck_hfs_image.sh,
which attaches the image read-only and no-mount, checks it, and always
detaches.

Measured 2026-08-07 on macOS 26.5.2 (fsck_hfs hfs-715.120.4): it still checks
**classic HFS**, announcing "Checking HFS volume", as well as "Checking
non-journaled HFS Plus Volume". macOS dropped HFS Standard *mounting* years
ago, so the assumption that fsck_hfs went with it is easy to make and wrong.
Both were also confirmed against Mac OS X 10.5.8 on a PowerMac G5, which
agrees — a period-authentic second opinion for the classic-HFS rows."""
availability = [
  { platform = "macos",   status = "verified", verified_on = "2026-08-07" },
  { platform = "windows", status = "absent" },
  { platform = "linux",   status = "absent" },
]
verifies = [
  { format = "fs.hfs",     direction = "write", strength = "authoritative", status = "proven", evidence = "fsck_hfs -> 'Checking HFS volume' + 'appears to be OK', macOS 26.5.2 and 10.5.8", check = ["{artifact}"], expect_stdout = "appears to be OK" },
  { format = "fs.hfsplus", direction = "write", strength = "authoritative", status = "proven", evidence = "fsck_hfs -> 'Checking non-journaled HFS Plus Volume' + 'appears to be OK'", check = ["{artifact}"], expect_stdout = "appears to be OK" },
  { format = "fs.hfv",     direction = "write", strength = "authoritative", status = "proven", evidence = "flat classic-HFS volume; same path as fs.hfs", check = ["{artifact}"], expect_stdout = "appears to be OK" },
]

