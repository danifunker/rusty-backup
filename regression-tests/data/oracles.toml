# --- NTFS --------------------------------------------------------------------

[[oracle]]
id = "chkdsk"
tool = "chkdsk"
kind = "package"
notes = "Windows' own NTFS checker. Relevant to R-007, where a freshly formatted volume fails its own fsck on BackupBootMismatch — chkdsk is the arbiter."
availability = [
  { platform = "windows", status = "expected" },
  { platform = "linux",   status = "absent" },
  { platform = "macos",   status = "absent" },
]
verifies = [{ format = "fs.ntfs", direction = "write", strength = "authoritative", status = "untested" }]

[[oracle]]
id = "mount-ntfs3"
tool = "mount -t ntfs3"
kind = "mount"
notes = "In-kernel NTFS driver; absent from WSL, needs a full Linux host."
availability = [
  { platform = "linux", status = "install" },
  { platform = "wsl",   status = "absent" },
]
verifies = [{ format = "fs.ntfs", direction = "write", strength = "structural", status = "untested" }]

