# --- R-008a / R-008b — AFFS bitmap and panic ---------------------------------
# Note R-020 says every AFFS volume we write is unmountable on a real Amiga at
# any size, so these three are the *visible* part of a deeper problem. They stay
# separate because they fail for the reasons R-008 describes, which a fix for
# R-020 alone would not address.
[[known]]
id = "fs.new-volume.affs"
finding = "R-008a"
[[known]]
id = "fs.new-volume.affs.4m"
finding = "R-008b"
[[known]]
id = "fs.new-volume.affs.32m"
finding = "R-008b"
[[known]]
id = "fs.new-volume.affs.bitmap-boundary-plus-one"
finding = "R-008a"

