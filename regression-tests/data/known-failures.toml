# Known failures — cases that fail because of a recorded bug, not a regression.
#
# This does NOT skip anything. Every case here still runs, every time. What
# changes is how the verdict is read:
#
#   fails   + listed  -> xfail   expected; the run stays green
#   PASSES  + listed  -> XPASS   the bug is fixed — remove the entry
#   fails   + unlisted-> fail    a real regression; the run goes red
#
# Skipping would stop the case running, so nobody would ever learn the bug had
# been fixed, and the case would rot. Running it and expecting failure keeps it
# honest in both directions.
#
# Rules:
#
#  * `finding` is mandatory and must name an entry in docs/Regression_Bugs.md.
#    An expected failure with no recorded cause is just a disabled test.
#  * Never edit a case's assertions to make it pass. Cases assert INTENDED
#    behaviour; that is the whole design. This file is the only sanctioned way
#    to say "we know, it is on the list".
#  * When a finding is fixed, delete its entries here. XPASS exists to make
#    forgetting loud — a stale entry silently swallows the next real regression
#    in that case.
#
# `rb-regress validate` cross-checks: an id here that matches no case, or a
# finding id not present in Regression_Bugs.md, is reported as a problem.

