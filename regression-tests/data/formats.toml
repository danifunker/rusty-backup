# Format registry — what rb-cli reads and writes.
#
# Source of truth for the COVERAGE.md and VERIFICATION-MATRIX.md tables, both
# of which are now GENERATED from this plus oracles.toml. Hand-edit here.
#
# `builder` names the rb-cli verb that can construct one. Presence means the
# WRITE path exists and therefore needs an oracle behind it. It is never
# itself evidence of correctness — see README.md "Why tier 1 is not coverage".

# --- Filesystems -------------------------------------------------------------

[[format]]
id = "fs.fat12"
kind = "fs"
name = "FAT12"
we_read = true
we_write = true
builder = "new floppy fat"

[[format]]
id = "fs.fat16"
kind = "fs"
name = "FAT16"
we_read = true
we_write = true
builder = "new volume fat"

[[format]]
id = "fs.fat32"
kind = "fs"
name = "FAT32"
we_read = true
we_write = true
builder = "new volume fat"
notes = "FAT32 is auto-selected above 2 GiB, so a synthesized FAT32 volume is expensive"

