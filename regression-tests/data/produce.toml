# Produce recipes — the runnable argv behind each format's `builder`.
#
# `formats.toml` records *that* a format has a write path (`builder = "new
# volume ext"`). That string names a verb; it is not a command. This file
# holds the command, so `rb-regress produce` can actually build the artifact.
#
# The two files are cross-checked: `rb-regress produce --list` reports every
# `builder` in formats.toml with no recipe here, and every recipe here whose
# `id` is not a known format. Neither gap is silent.
#
# Placeholders, substituted per recipe:
#   {out}   the artifact to produce — the only file kept
#   {work}  a scratch directory, discarded afterwards
#
# `pre` steps run in order before `args`, in the same scratch directory. They
# exist for the container formats, which convert an image rather than format a
# volume and therefore need a source to convert.
#
# Sizes are deliberately small. Produce runs every recipe twice on every OS to
# discover volatile byte ranges (see RUNBOOK.md § The run/verify split), so an
# artifact's cost is paid six times over three hosts. 2 MB is enough to
# exercise a formatter's structure; a size sweep is what tier 1 is for.

# --- Filesystems: bare volumes ----------------------------------------------

[[recipe]]
id = "fs.fat16"
ext = "img"
args = ["new", "volume", "fat", "--size", "2M", "{out}"]

[[recipe]]
id = "fs.ntfs"
ext = "img"
args = ["new", "volume", "ntfs", "--size", "2M", "{out}"]

[[recipe]]
id = "fs.hpfs"
ext = "img"
args = ["new", "volume", "hpfs", "--size", "2M", "{out}"]

[[recipe]]
id = "fs.ext2"
ext = "img"
args = ["new", "volume", "ext", "--size", "2M", "{out}"]

[[recipe]]
id = "fs.ext3"
ext = "img"
args = ["new", "volume", "ext3", "--size", "8M", "{out}"]

[[recipe]]
id = "fs.ext4"
ext = "img"
args = ["new", "volume", "ext4", "--size", "8M", "{out}"]

[[recipe]]
id = "fs.hfs"
ext = "img"
args = ["new", "volume", "hfs", "--size", "2M", "{out}"]

[[recipe]]
id = "fs.hfsplus"
ext = "img"
args = ["new", "volume", "hfsplus", "--size", "2M", "{out}"]

[[recipe]]
id = "fs.hfv"
ext = "hfv"
args = ["new", "volume", "hfv", "--size", "2M", "{out}"]

[[recipe]]
id = "fs.minix2"
ext = "img"
args = ["new", "volume", "minix2", "--size", "2M", "{out}"]

[[recipe]]
id = "fs.minix3"
ext = "img"
args = ["new", "volume", "minix3", "--size", "2M", "{out}"]

[[recipe]]
id = "fs.efs"
ext = "img"
args = ["new", "volume", "efs", "--size", "2M", "{out}"]

[[recipe]]
id = "fs.efs-v1"
ext = "img"
# 8M, not the 2M its siblings use: the Motion oracle drops this straight into
# the reference IRIS 3130's /usr slot, and a volume that small leaves the
# kernel almost nothing to mount.
args = ["new", "volume", "efs-v1", "--size", "8M", "{out}"]

[[recipe]]
id = "fs.affs"
ext = "img"
# 2M, not the 4M the other volumes use: R-008b panics at 4 MB and above, and a
# produce run that dies on a known finding tells us nothing new. Raise this
# when R-008b clears.
args = ["new", "volume", "affs", "--size", "2M", "{out}"]

[[recipe]]
id = "fs.prodos"
ext = "img"
# --name is not optional in practice; the default fails (R-006).
args = ["new", "volume", "prodos", "--size", "2M", "--name", "TESTVOL", "{out}"]

[[recipe]]
id = "fs.xfs"
ext = "img"
# XFS refuses below 32 MiB, so this one artifact is larger by necessity.
args = ["new", "volume", "xfs", "--size", "32M", "{out}"]

