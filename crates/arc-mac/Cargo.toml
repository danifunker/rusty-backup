[package]
name = "arc-mac"
version = "0.1.3"
edition = "2021"
rust-version = "1.73"
license = "MIT AND LGPL-2.1-or-later"
authors = ["Dani Sarfati <dani@funkervogt.com>"]
description = "Read classic Mac archives: StuffIt 1.5 / 5 / SEA, Compact Pro, MacBinary, BinHex, MacZip and mar, with resource forks and Finder info; write StuffIt and mar"
repository = "https://github.com/danifunker/rusty-backup"
readme = "README.md"
keywords = ["stuffit", "macintosh", "archive", "macbinary", "retro"]
categories = ["compression", "parser-implementations"]

[features]
# Only for a Rust 1.73 toolchain; see disk-core.
rust173-polyfill = ["disk-core/rust173-polyfill", "fs-mac/rust173-polyfill", "dsk-apple/rust173-polyfill"]

[dependencies]
disk-core = { path = "../disk-core", version = "0.2", default-features = false }
# Mac Roman names, BinHex and resource forks.
fs-mac = { path = "../fs-mac", version = "0.1", default-features = false, features = ["hfs", "forks"] }
# Detecting DiskCopy 4.2 images, which are often what an archive holds.
dsk-apple = { path = "../dsk-apple", version = "0.1", default-features = false, features = ["dc42"] }
anyhow = "1"
byteorder = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tempfile = "3"
