[package]
name = "fs-apple2"
version = "0.1.0"
edition = "2021"
rust-version = "1.73"
license = "MIT"
authors = ["Dani Sarfati <dani@funkervogt.com>"]
description = "Apple II era disk filesystems (UCSD p-System today; Apple DOS 3.3 and ProDOS to follow)"
repository = "https://github.com/danifunker/rusty-backup"
readme = "README.md"
keywords = ["filesystem", "apple2", "retro", "emulator", "disk-image"]
categories = ["filesystem", "emulators"]

[features]
default = ["ucsd"]
ucsd = []
# Only for a Rust 1.73 toolchain; see disk-core.
rust173-polyfill = ["disk-core/rust173-polyfill"]

[dependencies]
disk-core = { path = "../disk-core", version = "0.1", features = ["fs"] }
