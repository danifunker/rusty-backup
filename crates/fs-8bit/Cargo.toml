[package]
name = "fs-8bit"
version = "0.1.0"
edition = "2021"
rust-version = "1.73"
license = "MIT"
authors = ["Dani Sarfati <dani@funkervogt.com>"]
description = "Read and edit 8-bit home-computer disk filesystems: Commodore, Atari, Acorn DFS, TR-DOS, CoCo/Dragon, OS-9, TI-99, Oric, ANDOS"
repository = "https://github.com/danifunker/rusty-backup"
readme = "README.md"
keywords = ["filesystem", "retro", "commodore", "emulator", "disk-image"]
categories = ["filesystem", "emulators"]

[features]
default = ["acorn", "andos", "atari-dos", "cbm", "coco", "oric", "os9", "ti99", "trdos"]
# One feature per filesystem (or family) so users only build what they need.
acorn = []
andos = []
atari-dos = []
cbm = []
coco = []
oric = []
os9 = ["coco"]
ti99 = []
trdos = []
# Only for a Rust 1.73 toolchain; see disk-core.
rust173-polyfill = ["disk-core/rust173-polyfill"]

[dependencies]
disk-core = { path = "../disk-core", version = "0.1", features = ["fs"] }

[dev-dependencies]
# Unpacks the zstd test fixtures; 0.13 is the last line the Rust 1.73 builds resolve.
zstd = ">=0.13, <0.15"
