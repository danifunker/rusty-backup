[package]
name = "fs-squashfs"
version = "0.1.0"
edition = "2021"
rust-version = "1.73"
license = "MIT"
authors = ["Dani Sarfati <dani@funkervogt.com>"]
description = "Read, build, edit and verify SquashFS images (gzip, xz, lzma, lz4, zstd)"
repository = "https://github.com/danifunker/rusty-backup"
readme = "README.md"
keywords = ["filesystem", "squashfs", "linux", "disk-image"]
categories = ["filesystem", "compression"]

[features]
default = ["native-zstd"]
# zstd backend: the C libzstd (fast) or the pure-Rust, bit-exact port (no C to cross-compile).
native-zstd = ["dep:zstd"]
pure-zstd = ["dep:libzstd-bitexact-rs"]
# Only for a Rust 1.73 toolchain; see disk-core.
rust173-polyfill = ["disk-core/rust173-polyfill"]

[dependencies]
disk-core = { path = "../disk-core", version = "0.1", features = ["fs"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The lower bounds are what the Rust 1.73 builds resolve.
lz4_flex = ">=0.10, <0.15"
lzma-rs = "0.3.0"
# Edits rebuild the image into a temp file beside the original, then swap it in.
tempfile = "3"
zstd = { version = ">=0.13, <0.15", optional = true }
libzstd-bitexact-rs = { version = "0.157", optional = true }
