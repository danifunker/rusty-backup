[package]
name = "rb-fsimporter"
version = "0.2.0"
edition = "2021"
rust-version = "1.73"
license = "MIT"
authors = ["Dani Sarfati <dani@funkervogt.com>"]
description = "Import a host folder into any editable disk-core filesystem, with progress, cancellation and archive expansion"
repository = "https://github.com/danifunker/rusty-backup"
readme = "README.md"
keywords = ["filesystem", "import", "disk-image", "retro", "emulator"]
categories = ["filesystem", "emulators"]

[features]
default = ["native-zstd"]
# Rejoin Mac resource forks from `._name` / `.rsrc` sidecars and MacBinary / AppleSingle
# wrappers on HFS / MFS / ProDOS targets. Uses fs-mac's MIT-only codecs
# (no HFS, no fs-mac-unicode).
mac = ["dep:fs-mac", "fs-tar/appledouble"]
# .tar.zst expansion backend, forwarded to fs-tar.
native-zstd = ["fs-tar/native-zstd"]
pure-zstd = ["fs-tar/pure-zstd"]
# Only for a Rust 1.73 toolchain; see disk-core.
rust173-polyfill = ["disk-core/rust173-polyfill", "fs-tar/rust173-polyfill", "fs-mac?/rust173-polyfill"]

[dependencies]
anyhow = "1"
disk-core = { path = "../disk-core", version = "0.3", features = ["fs"] }
fs-tar = { path = "../fs-tar", version = "0.3", default-features = false, features = ["zip"] }
fs-mac = { path = "../fs-mac", version = "0.2", default-features = false, features = ["codecs"], optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
fs-pc = { path = "../fs-pc", version = "0.2", default-features = false, features = ["fat"] }
tempfile = "3"
tar = "0.4"
bzip2 = ">=0.5.2, <0.7"
zip = { version = ">=2.4.2, <10", default-features = false }
