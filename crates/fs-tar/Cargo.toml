[package]
name = "fs-tar"
version = "0.1.0"
edition = "2021"
rust-version = "1.73"
license = "MIT"
authors = ["Dani Sarfati <dani@funkervogt.com>"]
description = "Export any disk-core filesystem to tar / tar.gz / tar.zst, and import a tar into any editable one"
repository = "https://github.com/danifunker/rusty-backup"
readme = "README.md"
keywords = ["tar", "filesystem", "disk-image", "archive", "retro"]
categories = ["filesystem", "compression"]

[features]
default = ["native-zstd"]
# zstd backend for .tar.zst: the C libzstd (fast) or the pure-Rust, bit-exact port.
native-zstd = ["dep:zstd"]
pure-zstd = ["dep:libzstd-bitexact-rs"]
# Join macOS `._name` AppleDouble sidecars to their files as resource forks (pulls in fs-mac,
# which depends on the GPL-2.0-only fs-mac-unicode). Without it sidecars are skipped and counted.
appledouble = ["dep:fs-mac"]
# Only for a Rust 1.73 toolchain; see disk-core.
rust173-polyfill = ["disk-core/rust173-polyfill", "fs-mac?/rust173-polyfill"]

[dependencies]
disk-core = { path = "../disk-core", version = "0.1.1", features = ["fs"] }
anyhow = "1"
# The lower bound is what the Rust 1.73 builds resolve.
bzip2 = ">=0.5.2, <0.7"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
# Large members spool through a temp file rather than RAM.
tempfile = "3"
zstd = { version = ">=0.13, <0.15", optional = true }
libzstd-bitexact-rs = { version = "0.157", optional = true }
fs-mac = { path = "../fs-mac", version = "0.1", default-features = false, features = ["forks"], optional = true }

[dev-dependencies]
# The tests round-trip through real FAT, ext, UFS and HFS volumes.
fs-mac = { path = "../fs-mac", version = "0.1", default-features = false, features = ["hfs", "forks"] }
fs-pc = { path = "../fs-pc", version = "0.1", default-features = false, features = ["fat"] }
fs-unix = { path = "../fs-unix", version = "0.1", default-features = false, features = ["ext", "ufs"] }
