name: Release

# Manual release pipeline. Three modes, chosen at dispatch:
#
#   • build_only=true            → only verify the build on all OSes; stop.
#   • dry_run=true               → build check + preflight + `cargo publish
#                                   --dry-run`; no tag, no real publish.
#   • both false (full release)  → build check → derive tag from Cargo.toml,
#                                   create the git tag + GitHub Release → publish
#                                   to crates.io.
#
# The tag is always `v<version>` read from Cargo.toml — bump that first.
on:
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Only verify the build on all OSes (no tag, no publish)'
        type: boolean
        default: false
      dry_run:
        description: 'Validate against crates.io (cargo publish --dry-run); no tag, no publish'
        type: boolean
        default: false

# Every JavaScript action runs on Node 24 (Node 20 is deprecated on the runners).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write   # needed to create the tag + release

jobs:
  # Stage 1 — reuse the CI pipeline as the build-integrity gate (all OSes).
  build:
    name: Build gate
    uses: ./.github/workflows/ci.yml

  # Stage 2 — derive the tag from Cargo.toml and verify the packaged crate is
  # slim. Skipped in build_only mode.
  preflight:
    name: Preflight (derive tag, slim tarball)
    needs: build
    if: ${{ !inputs.build_only }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Derive tag from Cargo.toml
        id: derive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(grep -E '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          tag="v$version"
          echo "Derived tag: $tag"
          if git ls-remote --tags --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists on origin — bump Cargo.toml version first."
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub Release $tag already exists."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify slim tarball contents
        run: |
          set -euo pipefail
          cargo package --no-verify --allow-dirty --list > /tmp/package-files.txt
          echo "--- Files in tarball ---"
          cat /tmp/package-files.txt
          if grep -E '\.(bin|chd|iso|cue|so|dylib|dll|a)$' /tmp/package-files.txt; then
            echo "::error::Binary/fixture files in package — add to [package.exclude] in Cargo.toml."
            exit 1
          fi
          cargo package --no-verify --allow-dirty
          size=$(stat -c%s target/package/qnx2fs-*.crate)
          echo "Tarball size: $size bytes"
          if [ "$size" -gt 2097152 ]; then
            echo "::error::Tarball exceeds 2 MB cap."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: crate-tarball
          path: target/package/qnx2fs-*.crate

  # Stage 3 — stamp the tag + GitHub Release, then publish to crates.io.
  # In dry_run mode the tag/release is skipped and publish runs --dry-run.
  publish:
    name: Tag, release, publish
    needs: [build, preflight]
    if: ${{ !inputs.build_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Create tag and GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish --dry-run --allow-dirty
          else
            cargo publish --allow-dirty
          fi
