# Apply Changes asks before the table is written: a no writes nothing, and a yes to a question
# whose edits changed while it was open writes nothing either.
name = "Inspect: the table editor's yes counts only for the edits it named"
vm = "inspect"

[[step]]
action = "OpenImage"
arg = "$mbr_gap"
settle = true
expect = { partitions = 1 }

[[step]]
action = "AddPartition"

[[step]]
action = "TableAdd"
expect = { table_rows = 2 }

[[step]]
action = "ApplyTable"
effects = ["Confirm"]

[[step]]
action = "Confirm"
arg = false
settle = true
expect = { partitions = 1 }

[[step]]
action = "ApplyTable"
effects = ["Confirm"]

[[step]]
action = "TableDelete"
arg = 0

[[step]]
action = "Confirm"
arg = true
settle = true
expect = { partitions = 1, log = "~changed while the question was open" }
