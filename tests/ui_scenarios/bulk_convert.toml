# Bulk Convert: scan a folder, skip the output that already exists, convert the rest to raw.
name = "Bulk convert: scan, conflict, skip"
vm = "bulk_convert"

[[step]]
action = "Open"
expect = { open = true, phase = "setup" }

[[step]]
action = "PickSource"
effects = ["PickFolder"]

[[step]]
action = "AnswerSource"

[[step]]
action = "PickOutput"
effects = ["PickFolder"]

[[step]]
action = "AnswerOutput"

[[step]]
action = "SetFormat"
arg = "img"

[[step]]
action = "Scan"
settle = true
expect = { phase = "review", files = 2, selected = 2, extension = "img", can_start = true }

[[step]]
action = "SelectNone"
expect = { can_start = false, problem = "No files selected to convert." }

[[step]]
action = "SetExtension"
arg = "im g"
expect = { can_start = false }

[[step]]
action = "SetExtension"
arg = "img"

[[step]]
action = "SelectAll"

[[step]]
action = "Start"
expect = { conflicts = 1, running = false }

[[step]]
action = "Back"
expect = { conflicts = 0, running = false, open = true }

[[step]]
action = "Start"

[[step]]
action = "Skip"
expect = { open = false }

[[step]]
settle = true
expect = { running = false, result = "1 ok, 0 failed", outputs = "a.img:4,b.img:8192", log = "~Starting bulk convert: 1 file(s) -> " }
