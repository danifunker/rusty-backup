# Picking NTFS asks which Windows will use the volume, since NT 3.5 to 4.0 mount only NTFS 1.2;
# the answer sets the volume's version, the Options step can still change it, and it builds.
name = "Build Disk: an NTFS volume asks for its version"
vm = "build_disk"

[[step]]
action = "SetKind"
arg = "volume"

[[step]]
action = "VolumeFs"
arg = "ntfs"
effects = ["Choose"]
expect = { ntfs_version = "3.1" }

[[step]]
action = "ChooseNtfsVersion"
arg = 1
effects = []
expect = { ntfs_version = "1.2" }

[[step]]
action = "Next"

[[step]]
action = "OutputImage"
expect = { blocked = "" }

[[step]]
action = "Next"
expect = { step = "Disk" }

[[step]]
action = "SetSize"
arg = "32M"
expect = { blocked = "" }

[[step]]
action = "Next"
expect = { step = "Options" }

[[step]]
action = "Next"
expect = { step = "Review" }

[[step]]
action = "Next"
settle = true
expect = { result = "ok", opens = 1, ntfs_version = "1.2" }
